<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0F1E">
<title>I App — الطبيب</title>
<style>
  :root{
    --bg:#0A0F1E; --surface:#111827; --card:#141E30; --border:#1E2D45;
    --accent:#00C2FF; --teal:#00E5CC; --gold:#FFB830;
    --text:#E8F4FF; --muted:#6B8CAE; --danger:#FF4D6D; --success:#00E5B0;
    --purple:#A78BFA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.6;
       padding-bottom:env(safe-area-inset-bottom)}
  .app{max-width:820px;margin:0 auto;padding:12px}

  header{display:flex;align-items:center;gap:10px;padding:10px 4px 14px}
  .logo{font-size:22px}
  .title{font-weight:800;font-size:16px}
  .who{color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--success);box-shadow:0 0 8px var(--success)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
        padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 11px;color:var(--accent)}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);
        border-radius:10px;padding:10px 12px;color:var(--text);font-size:13.5px;
        outline:none;box-sizing:border-box;font-family:inherit;direction:rtl}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;line-height:1.5}
  label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px 2px}
  .field{margin-bottom:10px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  button{border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:13px;
         cursor:pointer;font-family:inherit;color:var(--bg);
         background:linear-gradient(135deg,var(--accent),var(--teal))}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  button.warn{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  button.sm{padding:7px 12px;font-size:11px;border-radius:8px}
  button:disabled{opacity:.45}
  .full{width:100%}

  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .tab{white-space:nowrap;background:var(--card);border:1px solid var(--border);
       color:var(--muted);border-radius:10px;padding:9px 14px;font-size:12.5px;
       font-weight:700;cursor:pointer}
  .tab.on{background:linear-gradient(135deg,var(--accent),var(--teal));
          color:var(--bg);border-color:transparent}
  .tab .n{display:inline-block;background:var(--danger);color:#fff;border-radius:9px;
          padding:0 6px;font-size:10px;margin-right:5px;font-weight:800}
  .tabs.sub .tab{padding:7px 12px;font-size:11.5px}

  /* بطاقات الإحصاء */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;
        padding:13px 10px;text-align:center;cursor:pointer;transition:border-color .15s}
  .stat:active{border-color:var(--accent)}
  .stat .v{font-size:24px;font-weight:800;line-height:1.2}
  .stat .l{color:var(--muted);font-size:11px;margin-top:3px}

  .apt{background:var(--card);border:1px solid var(--border);border-radius:14px;
       padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
  .apt::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--muted)}
  .apt.s-REQUESTED::before,.apt.s-PENDING::before{background:var(--gold)}
  .apt.s-CONFIRMED::before{background:var(--accent)}
  .apt.s-ARRIVED::before,.apt.s-WAITING::before{background:var(--teal)}
  .apt.s-IN_CLINIC::before{background:var(--success)}
  .apt.s-COMPLETED::before{background:var(--muted)}
  .apt.s-CANCELLED::before,.apt.s-NO_SHOW::before{background:var(--danger)}
  .apt-top{display:flex;gap:11px}
  .time{text-align:center;min-width:58px}
  .time b{display:block;color:var(--accent);font-size:15px;font-weight:800;direction:ltr}
  .time span{display:block;color:var(--muted);font-size:9.5px;direction:ltr}
  .info{flex:1;min-width:0}
  .nm{font-weight:700;font-size:14px}
  .chip{display:inline-block;border-radius:7px;padding:2px 8px;font-size:10px;font-weight:800}
  .meta{color:var(--muted);font-size:11px;margin-top:2px}
  .wait{color:var(--gold);font-size:11px;font-weight:700;margin-top:3px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;
        border-top:1px solid var(--border);padding-top:10px}

  .prow{display:flex;align-items:center;gap:10px;padding:11px 12px;
        background:var(--card);border:1px solid var(--border);border-radius:12px;
        margin-bottom:8px;cursor:pointer}
  .prow.off{opacity:.55}
  .avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;
          background:linear-gradient(135deg,var(--accent),var(--teal));
          display:flex;align-items:center;justify-content:center;
          color:var(--bg);font-weight:800;font-size:14px}

  .empty{text-align:center;color:var(--muted);padding:32px 14px;font-size:13px}
  .empty div:first-child{font-size:34px;margin-bottom:8px;opacity:.5}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
         background:var(--surface);border:1px solid var(--accent);color:var(--text);
         border-radius:12px;padding:11px 18px;font-size:12.5px;z-index:120;
         max-width:90vw;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .toast.bad{border-color:var(--danger);color:var(--danger)}
  .toast.good{border-color:var(--success);color:var(--success)}

  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;
         justify-content:center;padding:26px}
  .login .box{width:100%;max-width:330px}
  .err{color:var(--danger);font-size:12px;text-align:center;margin-top:9px;min-height:16px}

  /* ── الدفعة 2 ───────────────────────────────────────── */

  /* لا datalist — لا يعمل على أندرويد.
     البديل: select للاقتراحات يكتب في حقل نصي يبقى حرّاً */
  .combo{display:grid;grid-template-columns:1fr 88px;gap:6px;align-items:start}
  .combo select{font-size:11px;padding:10px 4px;color:var(--muted);text-align:center}

  .bar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .bar input{flex:1}
  .bar button{flex-shrink:0}

  .rec{background:var(--card);border:1px solid var(--border);border-radius:12px;
       padding:11px 12px;margin-bottom:9px}
  .rec .rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rec .rd{color:var(--accent);font-weight:800;font-size:12px}
  .rec .body{font-size:12.5px;margin-top:6px}
  .rec .ra{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;
           border-top:1px solid var(--border);padding-top:9px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin-top:5px}
  .kv b{color:var(--muted);font-weight:600;white-space:nowrap}
  .eyes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}
  .eye{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 9px}
  .eye .h{color:var(--muted);font-size:10px;font-weight:800;margin-bottom:2px}
  .eye .v{font-size:13px;font-weight:700;direction:ltr;text-align:right}
  .hi{color:var(--gold)}
  .alert{background:rgba(255,77,109,.09);border:1px solid var(--danger);
         border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
  .alert b{color:var(--danger)}
  .note{color:var(--muted);font-size:11.5px;background:var(--bg);
        border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:11px}
  .sect{color:var(--accent);font-size:12px;font-weight:800;margin:16px 0 8px;
        border-top:1px solid var(--border);padding-top:12px}
  .sect:first-of-type{border-top:none;padding-top:0;margin-top:0}

  /* النماذج في طبقة مستقلة حتى لا يمحوها التحديث المباشر */
  .sheet{position:fixed;inset:0;background:rgba(5,8,16,.88);z-index:100;
         overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
  .sheet .inner{max-width:820px;margin:0 auto;background:var(--card);
        border:1px solid var(--border);border-radius:16px;padding:15px}
  .shead{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .stitle{font-weight:800;font-size:15px;color:var(--accent);flex:1}
  .sfoot{display:flex;gap:8px;margin-top:15px}
  .sfoot button{flex:1}
</style>
</head>
<body>
<div id="root"><div class="empty" style="padding-top:100px"><div>👁</div>جاري التحميل...</div></div>
<div id="mroot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="./iapp-core.js?v=9"></script>
<script src="./appointment-service.js?v=9"></script>
<script src="./js/models.js?v=9"></script>
<script src="./js/svc-patients.js?v=9"></script>
<script src="./js/svc-clinical.js?v=9"></script>
<script src="./js/svc-rx.js?v=9"></script>
<script>
(function(){
"use strict";
var APP_VERSION='P5.2';           // الدفعة الثانية: المرضى · الملف · الزيارات · الفحوصات
var root=document.getElementById('root');
var mroot=document.getElementById('mroot');
var M, SVC, A;

var S={ profile:null, doctorId:null,
        view:'main', tab:'dash', clinic:null, clinics:[],
        stats:{}, today:[], live:[], due:[],
        q:'', archived:false, patients:[], pLoaded:false,
        pt:null, ptTab:'visits', ptData:{}, ptBusy:false,
        unsub:null, liveOn:false, liveStatus:null, loading:true };

// ── أدوات عرض ────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m,k,ms){ var d=document.createElement('div');
  d.className='toast'+(k?' '+k:''); d.textContent=m; document.body.appendChild(d);
  setTimeout(function(){d.remove();}, ms||3600); }
function initials(n){ return (String(n||'?').trim()[0]||'?'); }
function gv(id){ var e=document.getElementById(id); return e?e.value:''; }
function dash(v){ return (v==null||v==='')?'—':v; }

/** العمر من تاريخ الميلاد إن وُجد، وإلا العمر المسجَّل عند التسجيل */
function ageOf(p){
  if(p && p.date_of_birth && M.isDate(p.date_of_birth)){
    var d=new Date(p.date_of_birth+'T00:00:00'), n=new Date();
    var a=n.getFullYear()-d.getFullYear(), mo=n.getMonth()-d.getMonth();
    if(mo<0||(mo===0&&n.getDate()<d.getDate())) a--;
    return a>=0?a:null;
  }
  return (p && p.age_at_registration!=null) ? p.age_at_registration : null;
}

// ── مولّدات حقول ─────────────────────────────────────────
function fld(l,inner){ return '<div class="field"><label>'+esc(l)+'</label>'+inner+'</div>'; }
function I(id,v,type,extra){
  return '<input id="'+id+'"'+(type?' type="'+type+'"':'')+(extra?' '+extra:'')
    +' value="'+esc(v==null?'':v)+'">';
}
function T(id,v,rows){
  return '<textarea id="'+id+'" rows="'+(rows||2)+'">'+esc(v==null?'':v)+'</textarea>';
}
function pairsObj(o){ return Object.keys(o).map(function(k){ return [k,o[k]]; }); }
function pairsArr(a){ return a.map(function(x){ return [x,x]; }); }
function SEL(id,pairs,v,ph){
  return '<select id="'+id+'"><option value="">'+esc(ph||'—')+'</option>'
   + pairs.map(function(o){
       return '<option value="'+esc(o[0])+'"'
         +(String(v==null?'':v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';
     }).join('') + '</select>';
}
/**
 * حقل حرّ + قائمة اقتراحات.
 * لا datalist لأنه لا يعمل على أندرويد؛ هنا select حقيقي يكتب في الحقل،
 * والحقل يبقى نصّاً حرّاً فلا تُحاصَر صياغة الطبيب في قائمة مغلقة.
 * mode='add' يضيف للموجود (نتائج متعددة) · 'set' يستبدل (قيمة واحدة)
 */
function combo(l,id,v,list,mode,rows){
  return '<div class="field"><label>'+esc(l)+'</label><div class="combo">'
   +(rows?T(id,v,rows):I(id,v))
   +'<select class="pick" data-pick="'+id+'" data-mode="'+(mode||'set')+'">'
   +'<option value="">قائمة ▾</option>'
   + list.map(function(x){ return '<option value="'+esc(x)+'">'+esc(x)+'</option>'; }).join('')
   +'</select></div></div>';
}
function wireCombos(scope){
  (scope||document).querySelectorAll('[data-pick]').forEach(function(sl){
    sl.onchange=function(){
      var val=sl.value; if(!val) return;
      var t=document.getElementById(sl.getAttribute('data-pick'));
      if(t){
        if(sl.getAttribute('data-mode')==='add' && t.value.trim())
          t.value = t.value.replace(/[،\s]+$/,'') + '، ' + val;
        else t.value = val;
      }
      sl.value='';
    };
  });
}

// ── الطبقة المنبثقة ──────────────────────────────────────
function openSheet(title, body, onMount){
  mroot.innerHTML='<div class="sheet"><div class="inner">'
    +'<div class="shead"><div class="stitle">'+esc(title)+'</div>'
    +'<button class="ghost sm" id="mclose">إغلاق</button></div>'
    + body + '</div></div>';
  document.getElementById('mclose').onclick=closeSheet;
  wireCombos(mroot);
  document.body.style.overflow='hidden';
  if(onMount) onMount();
}
function closeSheet(){ mroot.innerHTML=''; document.body.style.overflow=''; }
function sheetOpen(){ return mroot.innerHTML.length>0; }
function busy(id,on,txt){
  var b=document.getElementById(id); if(!b) return;
  b.disabled=!!on; if(txt!=null) b.textContent=on?'... جارٍ الحفظ':txt;
}

// ════════════════════════════════════════════════════════
// المصادقة
// ════════════════════════════════════════════════════════
function renderLogin(err,busyFlag){
  root.innerHTML='<div class="login"><div class="box">'
   +'<div style="text-align:center;margin-bottom:26px">'
   +'<div style="font-size:46px">👁</div>'
   +'<div style="color:var(--accent);font-weight:800;font-size:21px">I App</div>'
   +'<div style="color:var(--muted);font-size:12px">تطبيق الطبيب · '
   +'<b style="color:var(--gold)">'+APP_VERSION+'</b></div></div>'
   +'<div class="field"><input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني" autocomplete="username"></div>'
   +'<div class="field"><input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password"></div>'
   +'<button class="full" id="go"'+(busyFlag?' disabled':'')+'>'+(busyFlag?'...':'دخول')+'</button>'
   +'<div class="err">'+esc(err||'')+'</div></div></div>';

  var go=function(){
    var em=document.getElementById('em').value, pw=document.getElementById('pw').value;
    if(!em||!pw){ renderLogin('أدخل البريد وكلمة المرور'); return; }
    renderLogin('',true);
    IAPP.signIn(em,pw).then(function(r){
      if(!r.ok){ renderLogin(r.error); return; }
      // الدور يُقرأ من الخادم؛ هذا الفحص للتجربة فقط، و RLS هو الأمان
      if(['doctor','admin'].indexOf(r.profile.role)===-1){
        IAPP.signOut();
        renderLogin('هذا الحساب ('+(IAPP.ROLE_AR[r.profile.role]||r.profile.role)+') غير مصرّح له');
        return;
      }
      IAPP._profile=r.profile; S.profile=r.profile; boot();
    }).catch(function(e){ renderLogin(e.message); });
  };
  document.getElementById('go').onclick=go;
  document.getElementById('pw').onkeydown=function(e){ if(e.key==='Enter') go(); };
}

// ════════════════════════════════════════════════════════
// التحميل
// ════════════════════════════════════════════════════════
async function boot(){
  try{
    S.clinics = await SVC.refs.clinics();
    if(!S.clinic && S.clinics.length) S.clinic = S.clinics[0].id;
  }catch(e){
    root.innerHTML='<div class="empty"><div>⚠️</div>تعذّر تحميل العيادات<br>'
      +'<span style="font-size:11px">'+esc(e.message)+'</span></div>';
    return;
  }
  await resolveDoctor();
  subscribe();
  await load();
}

/**
 * ربط الحساب بصف الطبيب في جدول doctors.
 * أسماء أعمدة الربط تختلف بين النسخ، لذا نجرّب المعروف منها ثم البريد.
 * إن لم نجد صفاً، يبقى doctor_id فارغاً — والخدمات تقبل null،
 * فلا يتعطل الحفظ بسبب ربط ناقص.
 */
async function resolveDoctor(){
  try{
    var docs = await SVC.refs.doctors();
    var uid = S.profile.userId || S.profile.user_id || S.profile.id || null;
    var mail = (S.profile.email||'').toLowerCase();
    var hit = docs.filter(function(d){
      if(uid && (d.user_id===uid || d.auth_user_id===uid || d.profile_id===uid || d.id===uid)) return true;
      if(mail && String(d.email||'').toLowerCase()===mail) return true;
      return false;
    })[0];
    S.doctorId = hit ? hit.id : null;
    if(!S.doctorId && docs.length===1) S.doctorId = docs[0].id;
  }catch(e){ S.doctorId=null; }
}

function subscribe(){
  if(S.unsub) try{S.unsub();}catch(e){}
  // تحديث فوري — لا استقصاء
  S.unsub = SVC.appointments.subscribe({
    clinicId:S.clinic, key:'doc5',
    onChange:function(){ load(true); },
    onReady:function(st){ S.liveOn=(st==='SUBSCRIBED'); S.liveStatus=st; autoRender(); }
  });
}

/** التحديث المباشر لا يعيد الرسم فوق نموذج مفتوح أو قائمة بحث قيد الكتابة */
function autoRender(){
  if(sheetOpen()) return;
  if(S.view==='main' && S.tab==='patients') return;
  render();
}

async function load(quiet){
  try{
    var res = await Promise.all([
      SVC.appointments.today(S.clinic),
      SVC.followups.due(M.today(), S.clinic),
      SVC.visits.countToday(S.clinic),
      SVC.patients.count()
    ]);
    S.today = res[0]||[];
    S.due   = res[1]||[];
    S.live  = S.today.filter(function(a){ return A.isLive(a.status); });
    S.stats = {
      appts: S.today.length,
      waiting: S.today.filter(function(a){ return a.status==='ARRIVED'||a.status==='WAITING'; }).length,
      inClinic: S.today.filter(function(a){ return a.status==='IN_CLINIC'; }).length,
      completed: res[2]||0,
      due: S.due.length,
      patients: res[3]||0
    };
  }catch(e){ if(!quiet) toast(e.message,'bad'); }
  S.loading=false;
  if(quiet) autoRender(); else render();
}

// ════════════════════════════════════════════════════════
// العرض — الهيكل
// ════════════════════════════════════════════════════════
function headerHTML(){
  return '<header><span class="logo">👁</span>'
   +'<div><div class="title">'+esc(S.profile.fullName||'الطبيب')+'</div>'
   +'<div class="who">'+esc(S.profile.email)+' · <b style="color:var(--gold)">'
   +APP_VERSION+'</b></div></div>'
   +'<div class="spacer"></div>'
   +'<div class="live"><span class="dot'+(S.liveOn?' on':'')+'"></span>'
   +(S.liveOn?'مباشر':(S.liveStatus&&S.liveStatus!=='SUBSCRIBED'?'غير متصل':'...'))+'</div>'
   +'<button class="ghost sm" id="out">خروج</button></header>';
}

function render(){
  if(!S.profile) return;
  var h='<div class="app">'+headerHTML();

  if(S.view==='profile'){
    h += profileHTML();
    h += '</div>'; root.innerHTML=h; wire();
    if(S.pt) paintPt();
    return;
  }

  h+='<div class="tabs">'
    +'<div class="tab'+(S.tab==='dash'?' on':'')+'" data-tab="dash">اليوم</div>'
    +'<div class="tab'+(S.tab==='wait'?' on':'')+'" data-tab="wait">غرفة الانتظار'
      +(S.live.length?'<span class="n">'+S.live.length+'</span>':'')+'</div>'
    +'<div class="tab'+(S.tab==='due'?' on':'')+'" data-tab="due">المتابعات'
      +(S.due.length?'<span class="n">'+S.due.length+'</span>':'')+'</div>'
    +'<div class="tab'+(S.tab==='patients'?' on':'')+'" data-tab="patients">المرضى</div>'
   +'</div>';

  if(S.clinics.length>1 && S.tab!=='patients'){
    h+='<div class="field"><select id="cl">'+S.clinics.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===S.clinic?' selected':'')+'>'+esc(c.name_ar)+'</option>';
    }).join('')+'</select></div>';
  }

  if(S.tab==='dash'){
    var st=S.stats;
    h+='<div class="stats">'
      +stat(st.appts,'مواعيد اليوم','var(--accent)','dash')
      +stat(st.waiting,'في الانتظار','var(--teal)','wait')
      +stat(st.inClinic,'داخل العيادة','var(--success)','wait')
      +stat(st.completed,'زيارات مكتملة','var(--muted)','')
      +stat(st.due,'متابعات مستحقة','var(--gold)','due')
      +stat(st.patients,'إجمالي المرضى','var(--purple)','patients')
      +'</div>'
      +'<div style="color:var(--muted);font-size:12px;margin-bottom:9px">'
      +esc(M.fmtDay(M.today()))+'</div>';
    h+= S.today.length ? S.today.map(function(a){return aptCard(a,true);}).join('')
      : '<div class="empty"><div>📅</div>لا مواعيد اليوم</div>';
  }

  if(S.tab==='wait'){
    h+='<div style="color:var(--muted);font-size:12px;margin-bottom:10px">'
      +'المرضى الموجودون في العيادة الآن</div>';
    h+= S.live.length ? S.live.map(function(a){return aptCard(a,true);}).join('')
      : '<div class="empty"><div>🪑</div>غرفة الانتظار فارغة</div>';
  }

  if(S.tab==='due'){
    h+='<div style="color:var(--muted);font-size:12px;margin-bottom:10px">'
      +'متابعات حان موعدها أو تأخّرت</div>';
    h+= S.due.length ? S.due.map(function(f){
      var late = f.due_date < M.today();
      return '<div class="prow" data-open="'+esc(f.patient_id)+'">'
        +'<div class="avatar">'+esc(initials(f._name))+'</div>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-weight:700;font-size:13.5px">'+esc(f._name||'—')+'</div>'
        +'<div class="meta">'+esc(f._code||'')
        +' · <span style="color:'+(late?'var(--danger)':'var(--gold)')+'">'
        +esc(f.due_date)+(late?' (متأخر)':'')+'</span>'
        +(f.reason?' · '+esc(f.reason):'')+'</div></div>'
        +(f._phone?'<button class="ghost sm" data-wa="'+esc(M.waPhone(f._phone))+'">💬</button>':'')
        +'<button class="ghost sm" data-fudone="'+f.id+'">تم</button>'
        +'</div>';
    }).join('') : '<div class="empty"><div>🔔</div>لا متابعات مستحقة</div>';
  }

  if(S.tab==='patients'){
    h+='<div class="bar">'
      +'<input id="q" placeholder="بحث بالاسم أو الهاتف أو الكود" value="'+esc(S.q)+'">'
      +'<button class="sm" id="newp">＋ مريض</button></div>'
      +'<div class="bar" style="margin-bottom:12px">'
      +'<button class="ghost sm" id="arch">'
      +(S.archived?'✓ يشمل المؤرشفين':'إظهار المؤرشفين')+'</button>'
      +'<div class="spacer"></div></div>'
      +'<div id="plist"></div>';
  }

  h+='</div>'; root.innerHTML=h; wire();

  if(S.tab==='dash'||S.tab==='wait') paintActions();
  if(S.tab==='patients'){
    if(!S.pLoaded){ loadPatients(); } else { paintPatients(); }
  }
}

function stat(v,l,color,tab){
  return '<div class="stat"'+(tab?' data-go="'+tab+'"':'')+'>'
    +'<div class="v" style="color:'+color+'">'+(v==null?'—':v)+'</div>'
    +'<div class="l">'+l+'</div></div>';
}

/** الأزرار تُشتق من جدول الانتقالات في الخادم — لا قواعد مكررة هنا */
function paintActions(){
  var rows = S.tab==='wait' ? S.live : S.today;
  rows.forEach(function(a){
    var box=document.querySelector('[data-acts="'+a.id+'"]');
    if(!box) return;
    SVC.appointments.actionsFor(a,S.profile.role).then(function(acts){
      if(!acts.length){ box.remove(); return; }
      acts.forEach(function(ac){
        var b=document.createElement('button');
        b.className='sm'+(ac.to==='CANCELLED'||ac.to==='NO_SHOW'?' ghost'
                        :(ac.to==='IN_CLINIC'||ac.to==='COMPLETED'?'':' ghost'));
        b.textContent=ac.label;
        b.onclick=function(e){ e.stopPropagation(); runAction(a,ac); };
        box.appendChild(b);
      });
    }).catch(function(){ box.remove(); });
  });
}

async function runAction(a,ac){
  if(ac.requiresReason){
    var r=prompt('السبب (إلزامي):','');
    if(r===null) return;
    if(r.trim().length<3){ toast('اكتب سبباً واضحاً','bad'); return; }
    try{ await ac.run(r.trim()); toast('تم','good'); load(); }
    catch(e){ toast(e.message,'bad'); }
    return;
  }
  try{ await ac.run(); toast('تم: '+ac.label,'good'); load(); }
  catch(e){ toast(e.message,'bad'); }
}

function aptCard(a, withActions){
  var lab=A.statusLabel(a.status), wait=A.waitLabel(a);
  return '<div class="apt s-'+a.status+'"'
   +(a.patient_id?' data-open="'+esc(a.patient_id)+'"':'')+'>'
   +'<div class="apt-top">'
     +'<div class="time"><b>'+esc((a.scheduled_time||'').slice(0,5))+'</b>'
     +'<span>'+esc(a.scheduled_date||'')+'</span></div>'
     +'<div class="info">'
       +'<div class="nm">'+esc(a.display_name||'—')
       +(a.patient_id?'':' <span style="color:var(--gold);font-size:10px">(زائر)</span>')+'</div>'
       +'<div class="meta"><span class="chip" style="background:'+lab.color+'22;color:'+lab.color+'">'
       +lab.icon+' '+lab.ar+'</span>'
       +(a.appointment_type?' · '+esc(a.appointment_type):'')
       +(a.room?' · غرفة '+esc(a.room):'')+'</div>'
       +(wait&&['ARRIVED','WAITING'].indexOf(a.status)>-1
          ?'<div class="wait">⏱ ينتظر منذ '+esc(wait)+'</div>':'')
     +'</div></div>'
   +(withActions?'<div class="acts" data-acts="'+a.id+'"></div>':'')
   +'</div>';
}

var qTimer=null;
async function loadPatients(){
  var box=document.getElementById('plist');
  if(box) box.innerHTML='<div class="empty">جارٍ التحميل...</div>';
  try{
    S.patients = await SVC.patients.list({
      search:S.q, includeArchived:S.archived, limit:60
    });
    S.pLoaded=true;
  }catch(e){ toast(e.message,'bad'); S.patients=[]; }
  paintPatients();
}

function paintPatients(){
  var box=document.getElementById('plist'); if(!box) return;
  if(!S.patients.length){
    box.innerHTML='<div class="empty"><div>👤</div>'
      +(S.q?'لا نتائج للبحث':'لا مرضى بعد')+'</div>';
    return;
  }
  box.innerHTML = S.patients.map(function(p){
    var age=ageOf(p);
    var bits=[];
    if(p.patient_code) bits.push(esc(p.patient_code));
    if(age!=null) bits.push(age+' سنة');
    if(p.gender && M.GENDER[p.gender] && p.gender!=='unknown') bits.push(M.GENDER[p.gender]);
    if(p.phone) bits.push('<span style="direction:ltr;display:inline-block">'+esc(p.phone)+'</span>');
    return '<div class="prow'+(p.is_active===false?' off':'')+'" data-open="'+esc(p.id)+'">'
      +'<div class="avatar">'+esc(initials(p.full_name))+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-weight:700;font-size:13.5px">'+esc(p.full_name||'—')
      +(p.is_active===false?' <span class="chip" style="background:#6B8CAE22;color:var(--muted)">مؤرشف</span>':'')
      +'</div><div class="meta">'+bits.join(' · ')+'</div></div>'
      +(p.phone?'<button class="ghost sm" data-wa="'+esc(M.waPhone(p.phone))+'">💬</button>':'')
      +'</div>';
  }).join('');
  wireRows(box);
}

function wireRows(scope){
  (scope||document).querySelectorAll('[data-open]').forEach(function(el){
    el.onclick=function(){ openPatient(el.getAttribute('data-open')); };
  });
  (scope||document).querySelectorAll('[data-wa]').forEach(function(el){
    el.onclick=function(e){ e.stopPropagation();
      window.open('https://wa.me/'+el.getAttribute('data-wa'),'_blank'); };
  });
}

async function openPatient(id){
  if(!id) return;
  S.view='profile'; S.pt=null; S.ptTab='visits'; S.ptData={};
  render();
  try{
    S.pt = await SVC.patients.get(id);
    render();
    loadPtTab();
  }catch(e){
    toast(e.message,'bad'); S.view='main'; render();
  }
}

function backToList(){
  S.view='main'; S.pt=null; S.ptData={};
  if(S.tab!=='patients' && S.tab!=='due') S.tab='patients';
  render();
}

async function loadPtTab(force){
  var t=S.ptTab, id=S.pt&&S.pt.id; if(!id) return;
  if(force) delete S.ptData[t];
  if(S.ptData[t]){ paintPt(); return; }
  S.ptBusy=true; paintPt();
  try{
    if(t==='visits') S.ptData.visits = await SVC.visits.listByPatient(id,30);
    if(t==='exams')  S.ptData.exams  = await SVC.examinations.listByPatient(id,30);
    if(t==='dx')     S.ptData.dx     = await SVC.diagnoses.listByPatient(id,40);
    if(t==='fu')     S.ptData.fu     = await SVC.followups.listByPatient(id);
  }catch(e){ toast(e.message,'bad'); S.ptData[t]=[]; }
  S.ptBusy=false; paintPt();
}

function paintPt(){
  var box=document.getElementById('ptbody'); if(!box) return;
  if(S.ptBusy){ box.innerHTML='<div class="empty">جارٍ التحميل...</div>'; return; }
  var t=S.ptTab, d=S.ptData[t]||[];
  if(t==='visits') box.innerHTML = d.length ? d.map(visitRec).join('')
    : '<div class="empty"><div>🗓</div>لا زيارات مسجَّلة</div>';
  if(t==='exams') box.innerHTML = d.length ? d.map(examRec).join('')
    : '<div class="empty"><div>🔬</div>لا فحوصات مسجَّلة</div>';
  if(t==='dx') box.innerHTML =
      '<div class="bar"><button class="sm" id="newdx">＋ تشخيص</button></div>'
    + (d.length ? d.map(dxRec).join('') : '<div class="empty"><div>📋</div>لا تشخيصات</div>');
  if(t==='fu') box.innerHTML =
      '<div class="bar"><button class="sm" id="newfu">＋ متابعة</button></div>'
    + (d.length ? d.map(fuRec).join('') : '<div class="empty"><div>🔔</div>لا متابعات</div>');
  wirePt(box);
}

function visitRec(v){
  return '<div class="rec"><div class="rt">'
    +'<span class="rd">'+esc(M.fmtDay(v.visit_date))+'</span>'
    +'<span class="chip" style="background:#00C2FF22;color:var(--accent)">'
    +esc(M.VISIT_TYPE[v.visit_type]||v.visit_type||'زيارة')+'</span></div>'
    +(v.chief_complaint?'<div class="body">'+esc(v.chief_complaint)+'</div>':'')
    +(v.summary?'<div class="body" style="color:var(--muted)">'+esc(v.summary)+'</div>':'')
    +(v.notes?'<div class="body" style="color:var(--muted)">'+esc(v.notes)+'</div>':'')
    +'<div class="ra"><button class="ghost sm" data-evisit="'+v.id+'">تعديل</button></div></div>';
}

function iopTxt(m){
  if(!m||m.value_mmhg==null) return '—';
  var n=Number(m.value_mmhg);
  return '<span'+(n>21?' class="hi"':'')+'>'+n+' mmHg'+(n>21?' ⚠':'')+'</span>';
}

function examRec(e){
  var h='<div class="rec"><div class="rt">'
    +'<span class="rd">'+esc(M.fmtDay(e.exam_date))+'</span>'
    +(e.chief_complaint?'<span style="font-size:12px">'+esc(e.chief_complaint)+'</span>':'')
    +'</div>';

  h+='<div class="eyes">'
    +'<div class="eye"><div class="h">اليمنى OD</div>'
    +'<div class="v">'+esc(dash(e.va_right))+'</div>'
    +'<div class="v" style="font-size:11.5px;color:var(--muted)">'+iopTxt(e._iop_od)+'</div></div>'
    +'<div class="eye"><div class="h">اليسرى OS</div>'
    +'<div class="v">'+esc(dash(e.va_left))+'</div>'
    +'<div class="v" style="font-size:11.5px;color:var(--muted)">'+iopTxt(e._iop_os)+'</div></div>'
    +'</div>';
  var kv='';
  function add(k,v){ if(v) kv+='<b>'+esc(k)+'</b><span>'+esc(v)+'</span>'; }
  add('القطاع الأمامي',e.anterior_segment);
  add('القطاع الخلفي',e.posterior_segment);
  add('رؤية الألوان',e.color_vision);
  add('التباين',e.contrast_sensitivity);
  add('اختبار التغطية',e.cover_test);

function dxRec(d){
  var col = d.status==='resolved'?'var(--muted)':(d.status==='chronic'?'var(--gold)':'var(--success)');
  return '<div class="rec"><div class="rt">'
    +'<span style="font-weight:700;font-size:13.5px">'+esc(d.diagnosis_text)+'</span>'
    +'<span class="chip" style="background:'+col+'22;color:'+col+'">'
    +esc(M.DX_STATUS[d.status]||d.status||'')+'</span>'
    +(d.eye?'<span class="chip" style="background:#A78BFA22;color:var(--purple)">'
      +esc(M.EYE[d.eye]||d.eye)+'</span>':'')
    +(d.is_primary?'<span class="chip" style="background:#00C2FF22;color:var(--accent)">أساسي</span>':'')
    +'</div><div class="meta">'+esc(d.diagnosed_on||'')
    +(d.icd10_code?' · '+esc(d.icd10_code):'')+'</div>'
    +'<div class="ra">'
    +(d.status!=='resolved'?'<button class="ghost sm" data-dxres="'+d.id+'">شُفي</button>':'')
    +'<button class="warn sm" data-dxdel="'+d.id+'">حذف</button></div></div>';

function fuRec(f){
  var late = f.status==='pending' && f.due_date < M.today();
  var col = f.status==='completed'?'var(--success)':(late?'var(--danger)':'var(--gold)');
  return '<div class="rec"><div class="rt">'
    +'<span class="rd" style="color:'+col+'">'+esc(f.due_date)+(late?' (متأخر)':'')+'</span>'
    +'<span class="chip" style="background:'+col+'22;color:'+col+'">'
    +esc(M.FU_STATUS[f.status]||f.status||'')+'</span></div>'
    +(f.reason?'<div class="body">'+esc(f.reason)+'</div>':'')
    +(f.notes?'<div class="body" style="color:var(--muted)">'+esc(f.notes)+'</div>':'')
    +(f.status==='pending'
      ?'<div class="ra"><button class="ghost sm" data-fudone2="'+f.id+'">تم</button></div>':'')
    +'</div>';
}

function wirePt(box){
  var b;
  b=box.querySelector('#newdx'); if(b) b.onclick=dxForm;
  b=box.querySelector('#newfu'); if(b) b.onclick=fuForm;
  box.querySelectorAll('[data-evisit]').forEach(function(el){
    el.onclick=function(){
      var id=el.getAttribute('data-evisit');
      visitForm((S.ptData.visits||[]).filter(function(v){return v.id===id;})[0]);
    };
  });
  box.querySelectorAll('[data-eexam]').forEach(function(el){
    el.onclick=function(){
      var id=el.getAttribute('data-eexam');
      examForm((S.ptData.exams||[]).filter(function(v){return v.id===id;})[0]);
    };
  });
  box.querySelectorAll('[data-dxres]').forEach(function(el){
    el.onclick=async function(){
      try{ await SVC.diagnoses.setStatus(el.getAttribute('data-dxres'),'resolved');
        toast('تم التحديث','good'); loadPtTab(true); }
      catch(e){ toast(e.message,'bad'); }
    };
  });
  box.querySelectorAll('[data-dxdel]').forEach(function(el){
    el.onclick=async function(){
      if(!confirm('حذف هذا التشخيص؟')) return;
      try{ await SVC.diagnoses.remove(el.getAttribute('data-dxdel'));
        toast('تم الحذف','good'); loadPtTab(true); }
      catch(e){ toast(e.message,'bad'); }
    };
  });
  box.querySelectorAll('[data-fudone2]').forEach(function(el){
    el.onclick=async function(){
      try{ await SVC.followups.setStatus(el.getAttribute('data-fudone2'),'completed');
        toast('تمت المتابعة','good'); loadPtTab(true); load(true); }
      catch(e){ toast(e.message,'bad'); }
    };
  });
}

   +'<div class="row">'+fld('العمر',I('f_age',p.age_at_registration,'number','inputmode="numeric"'))
   +fld('تاريخ الميلاد',I('f_dob',p.date_of_birth,'date'))+'</div>'
   +'<div class="row">'+fld('النوع',SEL('f_gender',pairsObj(M.GENDER),p.gender||'unknown','—'))
   +fld('فصيلة الدم',SEL('f_blood',pairsArr(M.BLOOD),p.blood_type,'—'))+'</div>'

   +'<div class="sect">التواصل</div>'
   +'<div class="row">'+fld('الهاتف',I('f_phone',p.phone,'tel','dir="ltr" inputmode="tel"'))
   +fld('هاتف بديل',I('f_alt',p.alt_phone,'tel','dir="ltr" inputmode="tel"'))+'</div>'
   +'<div class="row">'+fld('البريد الإلكتروني',I('f_email',p.email,'email','dir="ltr"'))
   +fld('المدينة',I('f_city',p.city))+'</div>'
   +fld('العنوان',I('f_addr',p.address))
   +'<div class="row">'+fld('المهنة',I('f_occ',p.occupation))
   +(isNew?fld('الرقم القومي',I('f_nid',p.national_id,'text','dir="ltr" inputmode="numeric"'))
          :fld('حالة الفرز',SEL('f_triage',pairsArr(M.TRIAGE),p.triage_status,'—')))+'</div>'
   +(isNew?fld('حالة الفرز',SEL('f_triage',pairsArr(M.TRIAGE),p.triage_status,'—')):'')
   +'<div class="row">'+fld('اسم شخص للطوارئ',I('f_ecn',p.emergency_contact_name))
   +fld('هاتف الطوارئ',I('f_ecp',p.emergency_contact_phone,'tel','dir="ltr" inputmode="tel"'))+'</div>'

   +'<div class="sect">سريري</div>'
   +fld('الحساسية',T('f_allergy',p.allergies,2))
   +fld('التاريخ المرضي',T('f_hist',p.medical_history,2))
   +fld('الحالة الأساسية',I('f_cond',p.primary_condition))
   +fld('ملاحظات',T('f_notes',p.notes,2))
   +(isNew&&S.clinics.length>1
      ? fld('العيادة الأساسية',SEL('f_clinic',S.clinics.map(function(c){return [c.id,c.name_ar];}),
            p.primary_clinic_id||S.clinic,'—'))
      : '')
   +'<div class="sfoot"><button class="ghost" id="mcancel">إلغاء</button>'
   +'<button id="save">حفظ</button></div>';

  openSheet(isNew?'مريض جديد':'تعديل بيانات المريض', h, function(){
    document.getElementById('mcancel').onclick=closeSheet;
    document.getElementById('save').onclick=async function(){
      var row={
        patient_code:gv('f_code'), full_name:gv('f_name'),
        age_at_registration:gv('f_age'), date_of_birth:gv('f_dob'),
        gender:gv('f_gender')||'unknown', blood_type:gv('f_blood'),
        phone:gv('f_phone'), alt_phone:gv('f_alt'), email:gv('f_email'),
        city:gv('f_city'), address:gv('f_addr'), occupation:gv('f_occ'),
        triage_status:gv('f_triage'),
        emergency_contact_name:gv('f_ecn'), emergency_contact_phone:gv('f_ecp'),
        allergies:gv('f_allergy'), medical_history:gv('f_hist'),
        primary_condition:gv('f_cond'), notes:gv('f_notes')
      };
      if(isNew){
        row.national_id=gv('f_nid');
        row.primary_clinic_id = gv('f_clinic') || S.clinic || null;
      }
      // الهاتف يُوحَّد قبل الحفظ حتى لا يتكرر المريض بصيغتي +20 و0
      row.phone=M.normPhone(row.phone); row.alt_phone=M.normPhone(row.alt_phone);
      row.emergency_contact_phone=M.normPhone(row.emergency_contact_phone);

      var chk=M.validatePatient(row);
      if(!chk.ok){ toast(chk.errors[0],'bad'); return; }
      busy('save',true,'حفظ');
      try{
        var saved = isNew ? await SVC.patients.create(row)
                          : await SVC.patients.update(p.id,row);
        closeSheet(); toast(isNew?'تم إضافة المريض':'تم حفظ التعديل','good');
        S.pLoaded=false;
        if(S.view==='profile'){ S.pt=saved; render(); paintPt(); }
        else if(isNew){ openPatient(saved.id); }
        else loadPatients();
        load(true);
      }catch(e){ busy('save',false,'حفظ'); toast(e.message,'bad',6000); }
    };
  });
}

// نموذج الزيارة

   +fld('الخلاصة',T('v_sum',v.summary,2))
   +fld('ملاحظات',T('v_notes',v.notes,2))
   +'<div class="sfoot"><button class="ghost" id="mcancel">إلغاء</button>'
   +'<button id="save">حفظ</button></div>';

  openSheet(isNew?'زيارة جديدة — '+(S.pt.full_name||''):'تعديل الزيارة', h, function(){

// ════════════════════════════════════════════════════════
// نموذج الفحص
// ════════════════════════════════════════════════════════
async function examForm(e){
  if(!S.pt) return;
  e = e || {};
  var isNew=!e.id;
  if(isNew && !S.ptData.visits){
    try{ S.ptData.visits = await SVC.visits.listByPatient(S.pt.id,20); }
    catch(err){ S.ptData.visits=[]; }
  }
  var vs=(S.ptData.visits||[]).map(function(v){
    return [v.id, M.fmtDay(v.visit_date)+' — '+(M.VISIT_TYPE[v.visit_type]||'زيارة')];
  });
  var todayVisit=(S.ptData.visits||[]).filter(function(v){return v.visit_date===M.today();})[0];

  var h='<div class="sect">أساسي</div>'
   +'<div class="row">'+fld('تاريخ الفحص',I('e_date',e.exam_date||M.today(),'date'))
   +(isNew && vs.length ? fld('مرتبط بزيارة',SEL('e_visit',vs,todayVisit?todayVisit.id:'','بدون'))
                        : fld('المريض',I('e_pt',S.pt.full_name,'text','disabled')))+'</div>'
   +combo('الشكوى','e_cc',e.chief_complaint,M.COMPLAINTS,'add')

   +'<div class="sect">حدة الإبصار</div>'
   +'<div class="row">'
   +combo('اليمنى OD','e_vad',e.va_right,M.VA,'set')
   +combo('اليسرى OS','e_vas',e.va_left,M.VA,'set')+'</div>';

  if(isNew){
    h+='<div class="row">'
     +fld('ضغط اليمنى (mmHg)',I('e_iopd','','number','inputmode="decimal" step="0.5"'))
     +fld('ضغط اليسرى (mmHg)',I('e_iops','','number','inputmode="decimal" step="0.5"'))+'</div>';
  }

  h+='<div class="sect">الفحص</div>'
   +'<div class="row">'
   +fld('رؤية الألوان',SEL('e_color',pairsArr(M.COLOR_VISION),e.color_vision,'—'))
   +fld('حساسية التباين',SEL('e_contrast',pairsArr(M.CONTRAST),e.contrast_sensitivity,'—'))+'</div>'
   +fld('اختبار التغطية',SEL('e_cover',pairsArr(M.COVER_TEST),e.cover_test,'—'))
   +combo('القطاع الأمامي','e_ant',e.anterior_segment,M.ANTERIOR,'add',2)
   +combo('القطاع الخلفي','e_post',e.posterior_segment,M.POSTERIOR,'add',2);

  if(isNew){
    h+='<div class="sect">التشخيص والخطة</div>'
     +combo('التشخيص','e_dx','',M.DIAGNOSES,'set')
     +fld('العين المصابة',SEL('e_dxeye',pairsObj(M.EYE),'','—'));
  } else {
    h+='<div class="sect">الخطة</div>';
  }

  h+=combo('خطة العلاج','e_plan',e.treatment_plan,M.PLANS,'add',2);

  if(isNew){
    h+='<div class="row">'+fld('موعد المتابعة',I('e_fudate','','date'))
     +fld('سبب المتابعة',I('e_fureason','',''))+'</div>';
  }

  h+=fld('ملاحظات',T('e_notes',e.notes,2));

  if(!isNew){
    h+='<div class="note">ضغط العين والتشخيص والمتابعة تُسجَّل مع الفحص وقت إنشائه، '
      +'ولا تُعدَّل من هنا. لتصحيحها أضف تشخيصاً أو متابعة من تبويبَيهما.</div>';
  }

  h+='<div class="sfoot"><button class="ghost" id="mcancel">إلغاء</button>'
   +'<button id="save">حفظ</button></div>';

  openSheet(isNew?'فحص جديد — '+(S.pt.full_name||''):'تعديل الفحص', h, function(){
    document.getElementById('mcancel').onclick=closeSheet;
    document.getElementById('save').onclick=async function(){
      var row={
        patient_id:S.pt.id, doctor_id:S.doctorId||null, clinic_id:S.clinic||null,
        exam_date:gv('e_date'), chief_complaint:gv('e_cc'),
        va_right:gv('e_vad'), va_left:gv('e_vas'),
        color_vision:gv('e_color'), contrast_sensitivity:gv('e_contrast'),
        cover_test:gv('e_cover'),
        anterior_segment:gv('e_ant'), posterior_segment:gv('e_post'),
        treatment_plan:gv('e_plan'), notes:gv('e_notes')
      };
      if(isNew){
        row.visit_id = gv('e_visit') || null;
        row.iop_right = gv('e_iopd'); row.iop_left = gv('e_iops');
        row.diagnosis_text = gv('e_dx'); row.diagnosis_eye = gv('e_dxeye')||null;
        row.follow_up_date = gv('e_fudate'); row.follow_up_reason = gv('e_fureason');
      }
      var chk=M.validateExam(row);
      if(!chk.ok){ toast(chk.errors[0],'bad'); return; }
      busy('save',true,'حفظ');
      try{
        if(isNew){
          var r = await SVC.examinations.createFull(row);
          closeSheet();
          // التحذيرات تُعرض كما هي: الفحص محفوظ وبعض توابعه لم يُحفظ
          if(r.warnings && r.warnings.length)
            toast('حُفظ الفحص — لكن: '+r.warnings.join(' · '),'bad',9000);
          else toast('تم حفظ الفحص','good');
          delete S.ptData.dx; delete S.ptData.fu;
        } else {
          await SVC.examinations.update(e.id,row);
          closeSheet(); toast('تم حفظ التعديل','good');
        }
        S.ptTab='exams'; loadPtTab(true); load(true);
      }catch(err){ busy('save',false,'حفظ'); toast(err.message,'bad',6000); }
    };
  });
}

function fuForm(){
  if(!S.pt) return;
  var h=fld('تاريخ المتابعة',I('u_date','','date'))
   +fld('السبب',I('u_reason','متابعة'))
   +fld('ملاحظات',T('u_notes','',2))
   +'<div class="sfoot"><button class="ghost" id="mcancel">إلغاء</button>'
   +'<button id="save">حفظ</button></div>';
  openSheet('متابعة جديدة', h, function(){
    document.getElementById('mcancel').onclick=closeSheet;
    document.getElementById('save').onclick=async function(){
      var row={ patient_id:S.pt.id, doctor_id:S.doctorId||null, clinic_id:S.clinic||null,

}

// ════════════════════════════════════════════════════════
function wire(){
  var b;
  b=document.getElementById('out');
  if(b) b.onclick=async function(){
    if(S.unsub) try{S.unsub();}catch(e){}
    await IAPP.signOut(); S.profile=null; closeSheet(); renderLogin();
  };
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.onclick=function(){ S.tab=el.getAttribute('data-tab'); S.view='main'; render(); };
  });
  document.querySelectorAll('[data-go]').forEach(function(el){
    el.onclick=function(){ S.tab=el.getAttribute('data-go'); S.view='main'; render(); };
  });
  document.querySelectorAll('[data-pt]').forEach(function(el){
    el.onclick=function(){ S.ptTab=el.getAttribute('data-pt'); render(); loadPtTab(); };
  });
  // this لا b: المتغيّر مشترك ويُعاد إسناده قبل أن يُستدعى المعالِج
  b=document.getElementById('cl');
  if(b) b.onchange=function(){ S.clinic=this.value; S.pLoaded=false; subscribe(); load(); };

  b=document.getElementById('q');
  if(b) b.oninput=function(){
    S.q=this.value; clearTimeout(qTimer); qTimer=setTimeout(loadPatients,340);
  };
  b=document.getElementById('newp');  if(b) b.onclick=function(){ patientForm(null); };
  b=document.getElementById('arch');
  if(b) b.onclick=function(){ S.archived=!S.archived; render(); loadPatients(); };

  b=document.getElementById('back');  if(b) b.onclick=backToList;
  b=document.getElementById('pedit'); if(b) b.onclick=function(){ patientForm(S.pt); };
  b=document.getElementById('newvisit'); if(b) b.onclick=function(){ visitForm(null); };
  b=document.getElementById('newexam'); if(b) b.onclick=function(){ examForm(null); };
  b=document.getElementById('parch');
  if(b) b.onclick=async function(){
    var off = S.pt.is_active===false;
    if(!off && !confirm('أرشفة المريض؟ السجل الطبي يبقى كاملاً ويختفي من القوائم فقط.')) return;
    try{
      if(off) await SVC.patients.unarchive(S.pt.id); else await SVC.patients.archive(S.pt.id);
      S.pt = await SVC.patients.get(S.pt.id);
      S.pLoaded=false; toast(off?'تمت الاستعادة':'تمت الأرشفة','good');
      render(); paintPt(); load(true);
    }catch(e){ toast(e.message,'bad'); }
  };

  document.querySelectorAll('[data-fudone]').forEach(function(el){
    el.onclick=async function(e){ e.stopPropagation();
      try{ await SVC.followups.setStatus(el.getAttribute('data-fudone'),'completed');
           toast('تمت المتابعة','good'); load(); }
      catch(err){ toast(err.message,'bad'); }
    };
  });
  wireRows(document);
}

// ════════════════════════════════════════════════════════
(async function(){
  var missing=[];
  if(!window.IAPP) missing.push('iapp-core.js');
  else{
    if(!IAPP.appointments) missing.push('appointment-service.js');
    if(!IAPP.models)       missing.push('js/models.js');
    if(!IAPP.svc||!IAPP.svc.patients)      missing.push('js/svc-patients.js');
    if(!IAPP.svc||!IAPP.svc.visits)        missing.push('js/svc-clinical.js');
    if(!IAPP.svc||!IAPP.svc.examinations)  missing.push('js/svc-clinical.js');
    if(!IAPP.svc||!IAPP.svc.prescriptions) missing.push('js/svc-rx.js');
  }
  if(missing.length){
    root.innerHTML='<div class="empty"><div>⚠️</div>ملفات ناقصة:<br>'
      +'<span style="font-size:11px;direction:ltr;display:block;margin-top:8px">'
      +missing.filter(function(v,i,a){return a.indexOf(v)===i;}).join('<br>')+'</span>'
      +'<div style="font-size:11px;margin-top:10px">تأكد من رفع مجلد js بجوار الصفحة</div></div>';
    return;
  }
  M=IAPP.models; SVC=IAPP.svc; A=IAPP.appointments;

  var s=await IAPP.getSession();
  if(!s){ renderLogin(); return; }
  var p=await IAPP.getProfile();
  if(!p||['doctor','admin'].indexOf(p.role)===-1){
    await IAPP.signOut(); renderLogin(p?'هذا الحساب غير مصرّح له':''); return;
  }
  IAPP._profile=p; S.profile=p; boot();
})();
})();
