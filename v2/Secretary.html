<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0F1E">
<title>I App — السكرتارية</title>
<style>
  :root{
    --bg:#0A0F1E; --surface:#111827; --card:#141E30; --border:#1E2D45;
    --accent:#00C2FF; --teal:#00E5CC; --gold:#FFB830;
    --text:#E8F4FF; --muted:#6B8CAE; --danger:#FF4D6D; --success:#00E5B0;
    --purple:#A78BFA;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.6;
       padding-bottom:env(safe-area-inset-bottom)}
  .app{max-width:760px;margin:0 auto;padding:12px}

  /* ── الرأس ── */
  header{display:flex;align-items:center;gap:10px;padding:10px 4px 14px;flex-wrap:wrap}
  .logo{font-size:22px}
  .title{font-weight:800;font-size:17px}
  .who{color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--success);box-shadow:0 0 8px var(--success)}

  /* ── عناصر عامة ── */
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
        padding:14px;margin-bottom:12px}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);
        border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;
        outline:none;box-sizing:border-box;font-family:inherit;direction:rtl}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px 2px}
  .field{margin-bottom:11px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:13px;
         cursor:pointer;font-family:inherit;color:var(--bg);
         background:linear-gradient(135deg,var(--accent),var(--teal))}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  button.danger{background:linear-gradient(135deg,var(--danger),#B01030);color:#fff}
  button.sm{padding:7px 12px;font-size:11px;border-radius:8px}
  button:disabled{opacity:.45}
  .full{width:100%}

  /* ── شريط التبويبات ── */
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .tab{white-space:nowrap;background:var(--card);border:1px solid var(--border);
       color:var(--muted);border-radius:10px;padding:9px 14px;font-size:12.5px;
       font-weight:700;cursor:pointer}
  .tab.on{background:linear-gradient(135deg,var(--accent),var(--teal));
          color:var(--bg);border-color:transparent}
  .tab .n{display:inline-block;background:var(--danger);color:#fff;border-radius:9px;
          padding:0 6px;font-size:10px;margin-right:5px;font-weight:800}

  /* ── شريط التاريخ ── */
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .datebar input{flex:1;text-align:center;direction:ltr}
  .nav{background:var(--card);border:1px solid var(--border);color:var(--accent);
       border-radius:10px;padding:10px 13px;font-size:15px;cursor:pointer;font-weight:800}

  /* ── بطاقة الموعد ── */
  .apt{background:var(--card);border:1px solid var(--border);border-radius:14px;
       padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
  .apt::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;
               background:var(--muted)}
  .apt.s-REQUESTED::before,.apt.s-PENDING::before{background:var(--gold)}
  .apt.s-CONFIRMED::before{background:var(--accent)}
  .apt.s-ARRIVED::before,.apt.s-WAITING::before{background:var(--teal)}
  .apt.s-IN_CLINIC::before{background:var(--success)}
  .apt.s-CANCELLED::before,.apt.s-NO_SHOW::before{background:var(--danger)}
  .apt-top{display:flex;align-items:flex-start;gap:11px}
  .time{text-align:center;min-width:56px}
  .time b{display:block;color:var(--accent);font-size:15px;font-weight:800;direction:ltr}
  .time span{display:block;color:var(--muted);font-size:9.5px;direction:ltr}
  .info{flex:1;min-width:0}
  .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--muted);font-size:11px;margin-top:2px}
  .chip{display:inline-block;border-radius:7px;padding:2px 8px;font-size:10px;font-weight:800}
  .wait{color:var(--gold);font-size:11px;font-weight:700;margin-top:3px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;
        border-top:1px solid var(--border);padding-top:10px}

  .empty{text-align:center;color:var(--muted);padding:34px 14px;font-size:13px}
  .empty div:first-child{font-size:34px;margin-bottom:8px;opacity:.5}

  /* ── نافذة ── */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;
      align-items:flex-end;justify-content:center;z-index:60;padding:0}
  .sheet{background:var(--surface);border:1px solid var(--border);
         border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:760px;
         max-height:92vh;overflow:auto}
  .sheet h3{margin:0 0 14px;font-size:15px;color:var(--accent)}
  @media(min-width:560px){
    .ov{align-items:center;padding:16px}
    .sheet{border-radius:16px}
  }

  /* ── تنبيه ── */
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
         background:var(--surface);border:1px solid var(--accent);color:var(--text);
         border-radius:12px;padding:11px 18px;font-size:12.5px;z-index:90;
         max-width:90vw;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .toast.bad{border-color:var(--danger);color:var(--danger)}
  .toast.good{border-color:var(--success);color:var(--success)}

  /* ── الدخول ── */
  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;
         justify-content:center;padding:26px}
  .login .box{width:100%;max-width:330px}
  .err{color:var(--danger);font-size:12px;text-align:center;margin-top:9px;min-height:16px}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px}
  .slot{background:var(--bg);border:1px solid var(--border);border-radius:9px;
        padding:9px 4px;text-align:center;font-size:12px;cursor:pointer;direction:ltr}
  .slot.on{background:linear-gradient(135deg,var(--accent),var(--teal));
           color:var(--bg);font-weight:800;border-color:transparent}
  .slot.off{opacity:.28;cursor:not-allowed;text-decoration:line-through}
</style>
</head>
<body>
<div id="root"><div class="empty" style="padding-top:100px"><div>👁</div>جاري التحميل...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="./iapp-core.js"></script>
<script src="./appointment-service.js"></script>
<script>
(function(){
"use strict";

var A, ST, root = document.getElementById('root');
var state = {
  profile:null, tab:'day', date:null, clinic:null, clinics:[], doctors:[],
  rows:[], inbox:[], loading:true, search:'', unsub:null, live:false
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function toast(msg, kind){
  var d=document.createElement('div');
  d.className='toast'+(kind?' '+kind:'');
  d.textContent=msg; document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3200);
}

function fmtDate(iso){
  if(!iso) return '';
  var days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var d=new Date(iso+'T00:00:00');
  return days[d.getDay()]+' '+iso;
}
function shiftDate(iso,n){
  var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function waNum(p){
  if(!p) return null;
  var s=String(p).replace(/[^\d]/g,'');
  if(s.indexOf('20')===0) return s;
  if(s.indexOf('0')===0) return '20'+s.slice(1);
  return '20'+s;
}

// ════════════════════════════════════════════════════════════
// تسجيل الدخول
// ════════════════════════════════════════════════════════════
function renderLogin(err, busy){
  root.innerHTML =
   '<div class="login"><div class="box">'
   +'<div style="text-align:center;margin-bottom:26px">'
   +'<div style="font-size:44px">👁</div>'
   +'<div style="color:var(--accent);font-weight:800;font-size:20px">I App</div>'
   +'<div style="color:var(--muted);font-size:12px">السكرتارية</div></div>'
   +'<div class="field"><input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني" autocomplete="username"></div>'
   +'<div class="field"><input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password"></div>'
   +'<button class="full" id="go"'+(busy?' disabled':'')+'>'+(busy?'...':'دخول')+'</button>'
   +'<div class="err">'+esc(err||'')+'</div>'
   +'</div></div>';

  var go=function(){
    var em=document.getElementById('em').value, pw=document.getElementById('pw').value;
    if(!em||!pw){ renderLogin('أدخل البريد وكلمة المرور'); return; }
    renderLogin('', true);
    IAPP.signIn(em,pw).then(function(r){
      if(!r.ok){ renderLogin(r.error); return; }
      if(['secretary','admin'].indexOf(r.profile.role)===-1){
        IAPP.signOut();
        renderLogin('هذا الحساب ('+(IAPP.ROLE_AR[r.profile.role]||r.profile.role)+') غير مصرّح له بتطبيق السكرتارية');
        return;
      }
      state.profile=r.profile; boot();
    });
  };
  document.getElementById('go').onclick=go;
  document.getElementById('pw').onkeydown=function(e){ if(e.key==='Enter') go(); };
}

// ════════════════════════════════════════════════════════════
// التحميل الأولي
// ════════════════════════════════════════════════════════════
async function boot(){
  state.date = state.date || IAPP.todayLocal();
  var sb = IAPP.client();
  try{
    var c = await sb.from('clinics').select('id,code,name_ar,phone,whatsapp')
                    .eq('is_active',true).order('name_ar');
    if(c.error) throw new Error(c.error.message);
    state.clinics = c.data||[];
    if(!state.clinic && state.clinics.length) state.clinic = state.clinics[0].id;

    var d = await sb.from('doctors').select('id,full_name_ar,short_name')
                    .order('full_name_ar');
    state.doctors = d.error ? [] : (d.data||[]);
  }catch(e){
    root.innerHTML='<div class="empty"><div>⚠️</div>تعذّر تحميل البيانات<br><span style="font-size:11px">'
      +esc(e.message)+'</span></div>';
    return;
  }
  subscribe();
  await load();
}

function subscribe(){
  if(state.unsub){ try{state.unsub();}catch(e){} }
  // تحديث فوري بدل الاستقصاء كل 15 ثانية
  state.unsub = A.subscribe({
    clinicId: state.clinic,
    key: 'sec',
    onChange: function(){ load(); },
    onReady: function(s){ state.live = (s==='SUBSCRIBED'); render(); }
  });
}

async function load(){
  try{
    var rows = await A.board({ clinicId: state.clinic, date: state.date });
    state.rows = rows||[];
    var inbox = await A.board({ clinicId: state.clinic,
                  status:[ST.REQUESTED, ST.PENDING] });
    state.inbox = inbox||[];
  }catch(e){
    toast(e.message,'bad');
  }
  state.loading=false;
  render();
}

// ════════════════════════════════════════════════════════════
// العرض
// ════════════════════════════════════════════════════════════
function aptCard(a, withActions){
  var lab = A.statusLabel(a.status);
  var wait = A.waitLabel(a);
  var wa = waNum(a.display_phone);
  var h = '<div class="apt s-'+a.status+'" data-id="'+a.id+'">'
    +'<div class="apt-top">'
      +'<div class="time"><b>'+esc((a.scheduled_time||'').slice(0,5))+'</b>'
      +'<span>'+esc(a.scheduled_date||'')+'</span></div>'
      +'<div class="info">'
        +'<div class="nm">'+esc(a.display_name||'—')
        +(a.patient_id?'':' <span style="color:var(--gold);font-size:10px">(زائر)</span>')+'</div>'
        +'<div class="meta">'
          +'<span class="chip" style="background:'+lab.color+'22;color:'+lab.color+'">'
          +lab.icon+' '+lab.ar+'</span>'
          +(a.appointment_type?' · '+esc(a.appointment_type):'')
          +(a.doctor_short?' · '+esc(a.doctor_short):'')
          +(a.room?' · غرفة '+esc(a.room):'')
        +'</div>'
        +(a.display_phone?'<div class="meta" dir="ltr" style="text-align:right">'+esc(a.display_phone)+'</div>':'')
        +(wait&&['ARRIVED','WAITING'].indexOf(a.status)>-1?'<div class="wait">⏱ ينتظر منذ '+esc(wait)+'</div>':'')
        +(a.status==='CANCELLED'&&a.cancel_reason?'<div class="meta" style="color:var(--danger)">السبب: '+esc(a.cancel_reason)+'</div>':'')
      +'</div>'
    +'</div>';

  if(withActions){
    h+='<div class="acts" data-acts="'+a.id+'">';
    if(wa) h+='<button class="ghost sm" data-wa="'+wa+'">💬 واتساب</button>';
    if(a.display_phone) h+='<button class="ghost sm" data-tel="'+esc(a.display_phone)+'">📞 اتصال</button>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function render(){
  if(!state.profile) return;
  var live = state.rows.filter(function(a){ return A.isLive(a.status); });
  var list = state.rows.filter(function(a){
    if(!state.search) return true;
    var q=state.search.toLowerCase();
    return (a.display_name||'').toLowerCase().indexOf(q)>-1
        || (a.display_phone||'').indexOf(state.search)>-1;
  });

  var h = '<div class="app">'
   +'<header>'
     +'<span class="logo">👁</span>'
     +'<div><div class="title">السكرتارية</div>'
     +'<div class="who">'+esc(state.profile.email)+'</div></div>'
     +'<div class="spacer"></div>'
     +'<div class="live"><span class="dot'+(state.live?' on':'')+'"></span>'
     +(state.live?'مباشر':'غير متصل')+'</div>'
     +'<button class="ghost sm" id="out">خروج</button>'
   +'</header>'

   +'<div class="tabs">'
     +'<div class="tab'+(state.tab==='day'?' on':'')+'" data-tab="day">مواعيد اليوم</div>'
     +'<div class="tab'+(state.tab==='inbox'?' on':'')+'" data-tab="inbox">طلبات المرضى'
       +(state.inbox.length?'<span class="n">'+state.inbox.length+'</span>':'')+'</div>'
     +'<div class="tab'+(state.tab==='wait'?' on':'')+'" data-tab="wait">غرفة الانتظار'
       +(live.length?'<span class="n">'+live.length+'</span>':'')+'</div>'
   +'</div>';

  if(state.clinics.length>1){
    h+='<div class="field"><select id="cl">'
      +state.clinics.map(function(c){
        return '<option value="'+c.id+'"'+(c.id===state.clinic?' selected':'')+'>'+esc(c.name_ar)+'</option>';
      }).join('')+'</select></div>';
  }

  if(state.tab==='day'){
    h+='<div class="datebar">'
      +'<button class="nav" data-shift="-1">‹</button>'
      +'<input type="date" id="dt" value="'+esc(state.date)+'">'
      +'<button class="nav" data-shift="1">›</button>'
      +'</div>'
      +'<div style="text-align:center;color:var(--muted);font-size:12px;margin:-6px 0 12px">'
      +esc(fmtDate(state.date))+' — '+list.length+' موعد</div>'
      +'<div class="field"><input id="sq" placeholder="🔍 بحث بالاسم أو الهاتف" value="'+esc(state.search)+'"></div>'
      +'<button class="full" id="newApt" style="margin-bottom:12px">+ حجز موعد جديد</button>';

    h += list.length
      ? list.map(function(a){ return aptCard(a,true); }).join('')
      : '<div class="empty"><div>📅</div>لا مواعيد في هذا اليوم</div>';
  }

  if(state.tab==='inbox'){
    h+='<div style="color:var(--muted);font-size:12px;margin-bottom:10px">'
      +'طلبات حجز واردة من المرضى تنتظر المراجعة</div>';
    h += state.inbox.length
      ? state.inbox.map(function(a){ return aptCard(a,true); }).join('')
      : '<div class="empty"><div>📭</div>لا طلبات جديدة</div>';
  }

  if(state.tab==='wait'){
    h+='<div style="color:var(--muted);font-size:12px;margin-bottom:10px">'
      +'المرضى الموجودون في العيادة الآن</div>';
    h += live.length
      ? live.map(function(a){ return aptCard(a,true); }).join('')
      : '<div class="empty"><div>🪑</div>غرفة الانتظار فارغة</div>';
  }

  h+='</div>';
  root.innerHTML=h;
  wire();
  paintActions();
}

// أزرار الإجراءات تُبنى من جدول الانتقالات في الخادم، لا من قواعد مكررة هنا
function paintActions(){
  var all = state.rows.concat(state.inbox);
  all.forEach(function(a){
    var box = document.querySelector('[data-acts="'+a.id+'"]');
    if(!box) return;
    A.actionsFor(a, state.profile.role).then(function(acts){
      if(!acts.length) return;
      acts.forEach(function(ac){
        var b=document.createElement('button');
        b.className='sm'; b.textContent=ac.label;
        if(ac.to==='CANCELLED'||ac.to==='NO_SHOW') b.className='sm danger';
        else if(ac.to!=='CONFIRMED'&&ac.to!=='IN_CLINIC') b.className='sm ghost';
        b.onclick=function(){ runAction(a, ac); };
        box.insertBefore(b, box.firstChild);
      });
      var rs=document.createElement('button');
      rs.className='sm ghost'; rs.textContent='إعادة جدولة';
      rs.onclick=function(){ openReschedule(a); };
      box.appendChild(rs);
    });
  });
}

async function runAction(a, ac){
  if(ac.requiresReason){
    var reason = prompt('سبب الإلغاء (إلزامي):','');
    if(reason===null) return;
    if(!reason.trim() || reason.trim().length<3){ toast('يجب كتابة سبب واضح','bad'); return; }
    try{ await ac.run(reason.trim()); toast('تم الإلغاء','good'); load(); }
    catch(e){ toast(e.message,'bad'); }
    return;
  }
  try{ await ac.run(); toast('تم: '+ac.label,'good'); load(); }
  catch(e){ toast(e.message,'bad'); }
}

function wire(){
  var out=document.getElementById('out');
  if(out) out.onclick=async function(){
    if(state.unsub) try{state.unsub();}catch(e){}
    await IAPP.signOut(); state.profile=null; renderLogin();
  };

  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.onclick=function(){ state.tab=el.getAttribute('data-tab'); render(); };
  });
  document.querySelectorAll('[data-shift]').forEach(function(el){
    el.onclick=function(){ state.date=shiftDate(state.date, +el.getAttribute('data-shift')); load(); };
  });
  var dt=document.getElementById('dt');
  if(dt) dt.onchange=function(){ state.date=dt.value||IAPP.todayLocal(); load(); };

  var cl=document.getElementById('cl');
  if(cl) cl.onchange=function(){ state.clinic=cl.value; subscribe(); load(); };

  var sq=document.getElementById('sq');
  if(sq) sq.oninput=function(){
    state.search=sq.value;
    var p=sq.selectionStart; render();
    var n=document.getElementById('sq'); if(n){ n.focus(); n.setSelectionRange(p,p); }
  };

  var na=document.getElementById('newApt');
  if(na) na.onclick=openBooking;

  document.querySelectorAll('[data-wa]').forEach(function(el){
    el.onclick=function(){ window.open('https://wa.me/'+el.getAttribute('data-wa'),'_blank'); };
  });
  document.querySelectorAll('[data-tel]').forEach(function(el){
    el.onclick=function(){ window.location.href='tel:'+el.getAttribute('data-tel'); };
  });
}

// ════════════════════════════════════════════════════════════
// نافذة الحجز
// ════════════════════════════════════════════════════════════
function sheet(html){
  var ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="sheet">'+html+'</div>';
  ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
  document.body.appendChild(ov);
  return ov;
}

function openBooking(){
  var ov = sheet(
     '<h3>حجز موعد جديد</h3>'
    +'<div class="field"><label>المريض</label>'
    +'<input id="q" placeholder="ابحث بالاسم أو الهاتف، أو اكتب اسم زائر"></div>'
    +'<div id="res" style="max-height:150px;overflow:auto;margin-bottom:10px"></div>'
    +'<div id="picked" style="display:none;background:var(--bg);border:1px solid var(--accent);'
    +'border-radius:10px;padding:9px;margin-bottom:11px;font-size:13px"></div>'
    +'<div class="row">'
      +'<div class="field"><label>التاريخ</label><input type="date" id="bd" value="'+esc(state.date)+'"></div>'
      +'<div class="field"><label>الطبيب</label><select id="bdoc"><option value="">—</option>'
      +state.doctors.map(function(d){return '<option value="'+d.id+'">'+esc(d.short_name||d.full_name_ar)+'</option>';}).join('')
      +'</select></div>'
    +'</div>'
    +'<div class="field"><label>الوقت المتاح</label><div id="slots" class="slots">'
    +'<div style="color:var(--muted);font-size:12px">جاري التحميل...</div></div></div>'
    +'<div class="row">'
      +'<div class="field"><label>نوع الكشف</label><input id="bt" placeholder="كشف / متابعة"></div>'
      +'<div class="field"><label>الغرفة</label><input id="br" placeholder="1"></div>'
    +'</div>'
    +'<div class="field"><label>ملاحظات</label><input id="bn"></div>'
    +'<div class="err" id="be"></div>'
    +'<div class="row"><button class="ghost" id="bc">إلغاء</button>'
    +'<button id="bs">حجز</button></div>');

  var chosen=null, slot=null;
  var $=function(i){ return ov.querySelector('#'+i); };

  $('bc').onclick=function(){ ov.remove(); };

  var t=null;
  $('q').oninput=function(){
    clearTimeout(t);
    var v=$('q').value.trim();
    chosen=null; $('picked').style.display='none';
    if(v.length<2){ $('res').innerHTML=''; return; }
    t=setTimeout(async function(){
      var sb=IAPP.client();
      // بلا فلتر deleted_at: سياسة RLS تستبعد المحذوفين أصلاً، والترشيح
      // بعمود غير ممنوح يجعل Postgres يرفض الاستعلام كاملاً.
      var r=await sb.from('patients').select('id,full_name,phone,patient_code')
             .or('full_name.ilike.%'+v+'%,phone.ilike.%'+v+'%')
             .limit(8);
      if(r.error){ $('res').innerHTML='<div style="color:var(--danger);font-size:11px">'+esc(r.error.message)+'</div>'; return; }
      $('res').innerHTML=(r.data||[]).length
        ? r.data.map(function(p){
            return '<div class="slot" style="text-align:right;margin-bottom:5px;direction:rtl" data-p="'+p.id+'">'
              +esc(p.full_name)+' <span style="color:var(--muted);font-size:10px">'+esc(p.phone||'')+'</span></div>';
          }).join('')
        : '<div style="color:var(--muted);font-size:11px">لا نتائج — سيُحجز كزائر بهذا الاسم</div>';
      ov.querySelectorAll('[data-p]').forEach(function(el){
        el.onclick=function(){
          var p=(r.data||[]).find(function(x){return x.id===el.getAttribute('data-p');});
          chosen=p;
          $('picked').style.display='block';
          $('picked').innerHTML='✓ '+esc(p.full_name)+' <span style="color:var(--muted)">'+esc(p.patient_code||'')+'</span>';
          $('res').innerHTML='';
        };
      });
    },320);
  };

  async function loadSlots(){
    slot=null;
    var box=$('slots'); box.innerHTML='<div style="color:var(--muted);font-size:12px">جاري التحميل...</div>';
    try{
      var s=await A.availableSlots(state.clinic, $('bd').value, $('bdoc').value||null);
      if(!s || !s.length){ box.innerHTML='<div style="color:var(--gold);font-size:12px">لا مواعيد عمل في هذا اليوم</div>'; return; }
      box.innerHTML=s.map(function(x){
        return '<div class="slot'+(x.is_free?'':' off')+'" data-s="'+x.slot_time+'">'
          +x.slot_time.slice(0,5)+'</div>';
      }).join('');
      box.querySelectorAll('[data-s]').forEach(function(el){
        if(el.classList.contains('off')) return;
        el.onclick=function(){
          box.querySelectorAll('.slot').forEach(function(o){o.classList.remove('on');});
          el.classList.add('on'); slot=el.getAttribute('data-s');
        };
      });
    }catch(e){ box.innerHTML='<div style="color:var(--danger);font-size:12px">'+esc(e.message)+'</div>'; }
  }
  $('bd').onchange=loadSlots; $('bdoc').onchange=loadSlots;
  loadSlots();

  $('bs').onclick=async function(){
    var name=$('q').value.trim();
    if(!chosen && name.length<2){ $('be').textContent='اختر مريضًا أو اكتب اسم الزائر'; return; }
    if(!slot){ $('be').textContent='اختر وقتًا'; return; }
    $('be').textContent=''; $('bs').disabled=true;
    try{
      await A.book({
        clinicId: state.clinic, date: $('bd').value, time: slot,
        patientId: chosen?chosen.id:null,
        guestName: chosen?null:name,
        doctorId: $('bdoc').value||null,
        type: $('bt').value||null, room: $('br').value||null,
        notes: $('bn').value||null
      });
      ov.remove(); toast('تم الحجز','good');
      state.date=$('bd').value; load();
    }catch(e){
      $('be').textContent=e.message; $('bs').disabled=false;
    }
  };
}

function openReschedule(a){
  var ov = sheet(
     '<h3>إعادة جدولة</h3>'
    +'<div style="color:var(--muted);font-size:12px;margin-bottom:12px">'
    +esc(a.display_name)+' — '+esc(a.scheduled_date)+' '+esc((a.scheduled_time||'').slice(0,5))+'</div>'
    +'<div class="field"><label>التاريخ الجديد</label><input type="date" id="rd" value="'+esc(a.scheduled_date)+'"></div>'
    +'<div class="field"><label>الوقت الجديد</label><div id="rs" class="slots">جاري التحميل...</div></div>'
    +'<div class="err" id="re"></div>'
    +'<div class="row"><button class="ghost" id="rc">إلغاء</button><button id="rg">تأكيد</button></div>');

  var slot=null, $=function(i){return ov.querySelector('#'+i);};
  $('rc').onclick=function(){ ov.remove(); };

  async function ld(){
    slot=null; var box=$('rs');
    box.innerHTML='<div style="color:var(--muted);font-size:12px">جاري التحميل...</div>';
    try{
      var s=await A.availableSlots(a.clinic_id, $('rd').value, a.doctor_id||null);
      if(!s||!s.length){ box.innerHTML='<div style="color:var(--gold);font-size:12px">لا مواعيد عمل</div>'; return; }
      box.innerHTML=s.map(function(x){
        return '<div class="slot'+(x.is_free?'':' off')+'" data-s="'+x.slot_time+'">'+x.slot_time.slice(0,5)+'</div>';
      }).join('');
      box.querySelectorAll('[data-s]').forEach(function(el){
        if(el.classList.contains('off')) return;
        el.onclick=function(){
          box.querySelectorAll('.slot').forEach(function(o){o.classList.remove('on');});
          el.classList.add('on'); slot=el.getAttribute('data-s');
        };
      });
    }catch(e){ box.innerHTML='<div style="color:var(--danger);font-size:12px">'+esc(e.message)+'</div>'; }
  }
  $('rd').onchange=ld; ld();

  $('rg').onclick=async function(){
    if(!slot){ $('re').textContent='اختر وقتًا'; return; }
    $('rg').disabled=true;
    try{
      await A.reschedule(a.id, { date:$('rd').value, time:slot });
      ov.remove(); toast('تمت إعادة الجدولة','good'); load();
    }catch(e){ $('re').textContent=e.message; $('rg').disabled=false; }
  };
}

// ════════════════════════════════════════════════════════════
// البداية
// ════════════════════════════════════════════════════════════
(async function(){
  if(!window.IAPP || !window.IAPP.appointments){
    root.innerHTML='<div class="empty"><div>⚠️</div>لم تُحمَّل الملفات المساعدة.<br>'
      +'<span style="font-size:11px">تأكد أن iapp-core.js و appointment-service.js '
      +'في نفس المجلد، وأن الصفحة مفتوحة من رابط https لا من الملف مباشرة.</span></div>';
    return;
  }
  A = IAPP.appointments; ST = A.STATUS;
  var s = await IAPP.getSession();
  if(!s){ renderLogin(); return; }
  var p = await IAPP.getProfile();
  if(!p || ['secretary','admin'].indexOf(p.role)===-1){
    await IAPP.signOut(); renderLogin(p?'هذا الحساب غير مصرّح له':''); return;
  }
  state.profile=p; boot();
})();

})();
</script>
