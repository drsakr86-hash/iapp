<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0F1E">
<title>I App — بوابة المريض</title>
<style>
  :root{
    --bg:#0A0F1E; --surface:#111827; --card:#141E30; --border:#1E2D45;
    --accent:#00C2FF; --teal:#00E5CC; --gold:#FFB830;
    --text:#E8F4FF; --muted:#6B8CAE; --danger:#FF4D6D; --success:#00E5B0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.6;
       padding-bottom:env(safe-area-inset-bottom)}
  .app{max-width:620px;margin:0 auto;padding:12px}

  header{display:flex;align-items:center;gap:10px;padding:10px 4px 14px}
  .logo{font-size:22px}
  .title{font-weight:800;font-size:16px}
  .who{color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--success);box-shadow:0 0 8px var(--success)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
        padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 11px;color:var(--accent)}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);
        border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;
        outline:none;box-sizing:border-box;font-family:inherit;direction:rtl}
  input:focus,select:focus{border-color:var(--accent)}
  label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px 2px}
  .field{margin-bottom:11px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{border:none;border-radius:10px;padding:12px 16px;font-weight:700;font-size:13.5px;
         cursor:pointer;font-family:inherit;color:var(--bg);
         background:linear-gradient(135deg,var(--accent),var(--teal))}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  button.danger{background:linear-gradient(135deg,var(--danger),#B01030);color:#fff}
  button.sm{padding:7px 12px;font-size:11px;border-radius:8px}
  button:disabled{opacity:.45}
  .full{width:100%}

  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .tab{white-space:nowrap;background:var(--card);border:1px solid var(--border);
       color:var(--muted);border-radius:10px;padding:9px 14px;font-size:12.5px;
       font-weight:700;cursor:pointer}
  .tab.on{background:linear-gradient(135deg,var(--accent),var(--teal));
          color:var(--bg);border-color:transparent}

  .apt{background:var(--card);border:1px solid var(--border);border-radius:14px;
       padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
  .apt::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--muted)}
  .apt.s-REQUESTED::before,.apt.s-PENDING::before{background:var(--gold)}
  .apt.s-CONFIRMED::before{background:var(--accent)}
  .apt.s-ARRIVED::before,.apt.s-WAITING::before{background:var(--teal)}
  .apt.s-IN_CLINIC::before{background:var(--success)}
  .apt.s-CANCELLED::before,.apt.s-NO_SHOW::before{background:var(--danger)}
  .apt-top{display:flex;gap:11px}
  .time{text-align:center;min-width:58px}
  .time b{display:block;color:var(--accent);font-size:15px;font-weight:800;direction:ltr}
  .time span{display:block;color:var(--muted);font-size:9.5px;direction:ltr}
  .info{flex:1;min-width:0}
  .chip{display:inline-block;border-radius:7px;padding:2px 9px;font-size:10.5px;font-weight:800}
  .meta{color:var(--muted);font-size:11.5px;margin-top:3px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;
        border-top:1px solid var(--border);padding-top:10px}

  .empty{text-align:center;color:var(--muted);padding:34px 14px;font-size:13px}
  .empty div:first-child{font-size:34px;margin-bottom:8px;opacity:.5}

  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px}
  .slot{background:var(--bg);border:1px solid var(--border);border-radius:9px;
        padding:9px 4px;text-align:center;font-size:12px;cursor:pointer;direction:ltr}
  .slot.on{background:linear-gradient(135deg,var(--accent),var(--teal));
           color:var(--bg);font-weight:800;border-color:transparent}
  .slot.off{opacity:.25;cursor:not-allowed;text-decoration:line-through}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
         background:var(--surface);border:1px solid var(--accent);color:var(--text);
         border-radius:12px;padding:11px 18px;font-size:12.5px;z-index:90;
         max-width:90vw;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .toast.bad{border-color:var(--danger);color:var(--danger)}
  .toast.good{border-color:var(--success);color:var(--success)}

  .auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;
        justify-content:center;padding:24px}
  .auth .box{width:100%;max-width:340px}
  .err{color:var(--danger);font-size:12px;text-align:center;margin-top:9px;min-height:16px}
  .hint{background:rgba(0,194,255,.1);border:1px solid var(--accent);color:var(--accent);
        border-radius:10px;padding:11px 13px;font-size:11.5px;margin-bottom:14px;line-height:1.7}
  .swap{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
  .swap b{color:var(--accent);cursor:pointer}
  .kv{display:flex;justify-content:space-between;padding:7px 0;
      border-bottom:1px solid var(--border);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="root"><div class="empty" style="padding-top:100px"><div>👁</div>جاري التحميل...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="./iapp-core.js?v=3"></script>
<script src="./appointment-service.js?v=3"></script>
<script>
(function(){
"use strict";
var A, ST, root=document.getElementById('root');
var S={ liveStatus:null, profile:null, link:null, tab:'apts', apts:[], clinics:[], clinic:null,
        rx:[], exams:[], loading:true, unsub:null, live:false, mode:'in' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m,k){ var d=document.createElement('div');
  d.className='toast'+(k?' '+k:''); d.textContent=m; document.body.appendChild(d);
  setTimeout(function(){d.remove();},3400); }
function fmtDay(iso){ if(!iso) return '';
  var days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  return days[new Date(iso+'T00:00:00').getDay()]+' '+iso; }

// ════════════════════════════════════════════════════════
// 1) الدخول / إنشاء حساب
// ════════════════════════════════════════════════════════
function renderAuth(err,busy){
  var signup = S.mode==='up';
  root.innerHTML='<div class="auth"><div class="box">'
   +'<div style="text-align:center;margin-bottom:24px">'
   +'<div style="font-size:44px">👁</div>'
   +'<div style="color:var(--accent);font-weight:800;font-size:20px">I App</div>'
   +'<div style="color:var(--muted);font-size:12px">بوابة المريض</div></div>'
   +(signup?'<div class="hint">أنشئ حسابك ببريد وكلمة مرور، ثم اربطه بملفك في العيادة.</div>':'')
   +'<div class="field"><input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني" autocomplete="username"></div>'
   +'<div class="field"><input id="pw" type="password" placeholder="كلمة المرور" autocomplete="'+(signup?'new-password':'current-password')+'"></div>'
   +'<button class="full" id="go"'+(busy?' disabled':'')+'>'+(busy?'...':(signup?'إنشاء حساب':'دخول'))+'</button>'
   +'<div class="err">'+esc(err||'')+'</div>'
   +'<div class="swap">'+(signup?'لديك حساب؟ <b id="sw">تسجيل الدخول</b>':'ليس لديك حساب؟ <b id="sw">أنشئ واحدًا</b>')+'</div>'
   +'</div></div>';

  document.getElementById('sw').onclick=function(){ S.mode=signup?'in':'up'; renderAuth(); };

  var go=async function(){
    var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
    if(!em||!pw){ renderAuth('أدخل البريد وكلمة المرور'); return; }
    if(signup && pw.length<8){ renderAuth('كلمة المرور 8 أحرف على الأقل'); return; }
    renderAuth('',true);
    try{
      if(signup){
        var r=await IAPP.client().auth.signUp({email:em,password:pw});
        if(r.error){ renderAuth(/already/i.test(r.error.message)?'هذا البريد مسجّل بالفعل':r.error.message); return; }
        if(!r.data.session){ renderAuth('تم إنشاء الحساب. فعّل بريدك ثم سجّل الدخول.'); S.mode='in'; return; }
      } else {
        var l=await IAPP.signIn(em,pw);
        if(!l.ok){ renderAuth(l.error); return; }
      }
      await start();
    }catch(e){ renderAuth(e.message); }
  };
  document.getElementById('go').onclick=go;
  document.getElementById('pw').onkeydown=function(e){ if(e.key==='Enter') go(); };
}

// ════════════════════════════════════════════════════════
// 2) ربط الحساب بالملف الطبي
// ════════════════════════════════════════════════════════
function renderClaim(err,busy){
  root.innerHTML='<div class="auth"><div class="box">'
   +'<div style="text-align:center;margin-bottom:20px">'
   +'<div style="font-size:40px">🔗</div>'
   +'<div style="color:var(--accent);font-weight:800;font-size:17px">ربط ملفك الطبي</div></div>'
   +'<div class="hint">أدخل <b>كود المريض</b> و<b>رقم الهاتف</b> المسجَّلين لدى العيادة.'
   +'<br>لو لا تعرف الكود، اتصل بالعيادة.</div>'
   +'<div class="field"><label>كود المريض</label>'
   +'<input id="cd" dir="ltr" placeholder="P-0001" autocapitalize="characters"></div>'
   +'<div class="field"><label>رقم الهاتف</label>'
   +'<input id="ph" dir="ltr" type="tel" placeholder="01xxxxxxxxx"></div>'
   +'<button class="full" id="go"'+(busy?' disabled':'')+'>'+(busy?'...':'ربط')+'</button>'
   +'<div class="err">'+esc(err||'')+'</div>'
   +'<div class="swap"><b id="out">تسجيل الخروج</b></div>'
   +'</div></div>';

  document.getElementById('out').onclick=async function(){ await IAPP.signOut(); S.profile=null; renderAuth(); };
  document.getElementById('go').onclick=async function(){
    var cd=document.getElementById('cd').value.trim(), ph=document.getElementById('ph').value.trim();
    if(!cd||!ph){ renderClaim('أدخل الكود ورقم الهاتف'); return; }
    renderClaim('',true);
    try{
      var r=await IAPP.client().schema('iapp').rpc('claim_patient_record',{p_code:cd,p_phone:ph});
      if(r.error){
        var m=r.error.message||'';
        renderClaim(/no_match/.test(m)?'الكود أو رقم الهاتف غير صحيح'
          :/already_linked/.test(m)?'هذا الملف مرتبط بحساب آخر — تواصل مع العيادة'
          :/rate_limited/.test(m)?'محاولات كثيرة — انتظر ساعة'
          :m);
        return;
      }
      toast('تم ربط ملفك بنجاح','good');
      await start();
    }catch(e){ renderClaim(e.message); }
  };
}

// ════════════════════════════════════════════════════════
// 3) التحميل
// ════════════════════════════════════════════════════════
async function start(){
  var p=await IAPP.getProfile(true);
  if(!p){ renderAuth('تعذّر قراءة الحساب'); return; }
  S.profile=p;

  if(p.role!=='patient'){
    // الموظفون لهم تطبيقاتهم
    await IAPP.signOut();
    renderAuth('هذا الحساب ('+(IAPP.ROLE_AR[p.role]||p.role)+') له تطبيق آخر');
    return;
  }

  var st=await IAPP.client().schema('iapp').rpc('my_link_status');
  S.link = (st.error||!st.data||!st.data.linked) ? null : st.data;
  if(!S.link){ renderClaim(); return; }

  var c=await IAPP.client().from('clinics').select('id,code,name_ar,address,phone,whatsapp')
        .eq('is_active',true).order('name_ar');
  S.clinics=c.error?[]:(c.data||[]);
  if(!S.clinic&&S.clinics.length) S.clinic=S.clinics[0].id;

  if(S.unsub) try{S.unsub();}catch(e){}
  S.unsub=A.subscribe({
    patientId:S.link.patient_id, key:'pat',
    onStatusChange:function(ev){
      toast('تحدثت حالة موعدك: '+A.statusLabel(ev.to).ar,'good');
    },
    onChange:function(){ load(); },
    onReady:function(s){ S.live=(s==='SUBSCRIBED'); S.liveStatus=s; render(); }
  });
  await load();
}

async function load(){
  try{
    S.apts=await A.board({});                 // RLS يعيد مواعيده فقط
    var sb=IAPP.client();
    var rx=await sb.from('v_my_prescriptions').select('*').order('prescribed_on',{ascending:false}).limit(30);
    S.rx=rx.error?[]:(rx.data||[]);
    var ex=await sb.from('v_my_examinations').select('*').order('exam_date',{ascending:false}).limit(30);
    S.exams=ex.error?[]:(ex.data||[]);
  }catch(e){ toast(e.message,'bad'); }
  S.loading=false; render();
}

// ════════════════════════════════════════════════════════
// 4) العرض
// ════════════════════════════════════════════════════════
function aptCard(a){
  var lab=A.statusLabel(a.status);
  return '<div class="apt s-'+a.status+'">'
   +'<div class="apt-top">'
     +'<div class="time"><b>'+esc((a.scheduled_time||'').slice(0,5))+'</b>'
     +'<span>'+esc(a.scheduled_date||'')+'</span></div>'
     +'<div class="info">'
       +'<span class="chip" style="background:'+lab.color+'22;color:'+lab.color+'">'
       +lab.icon+' '+lab.ar+'</span>'
       +'<div class="meta">'+esc(fmtDay(a.scheduled_date))+'</div>'
       +(a.clinic_name?'<div class="meta">🏥 '+esc(a.clinic_name)+'</div>':'')
       +(a.doctor_name?'<div class="meta">👨‍⚕️ '+esc(a.doctor_name)+'</div>':'')
       +(a.appointment_type?'<div class="meta">'+esc(a.appointment_type)+'</div>':'')
       +(a.status==='CANCELLED'&&a.cancel_reason
          ?'<div class="meta" style="color:var(--danger)">السبب: '+esc(a.cancel_reason)+'</div>':'')
     +'</div>'
   +'</div>'
   +(A.isOpen(a.status)?'<div class="acts" data-acts="'+a.id+'"></div>':'')
   +'</div>';
}

function render(){
  if(!S.profile||!S.link) return;
  var open=S.apts.filter(function(a){return A.isOpen(a.status);});
  var past=S.apts.filter(function(a){return !A.isOpen(a.status);});

  var h='<div class="app"><header>'
   +'<span class="logo">👁</span>'
   +'<div><div class="title">'+esc(S.link.name||'مريض')+'</div>'
   +'<div class="who">'+esc(S.link.code||'')+' · '+esc(A.build||'?')+'</div></div>'
   +'<div class="spacer"></div>'
   +'<div class="live" title="'+esc(S.liveStatus||'')+'"><span class="dot'+(S.live?' on':'')+'"></span>'
   +(S.live?'مباشر':(S.liveStatus&&S.liveStatus!=='SUBSCRIBED'?'غير متصل':'...'))+'</div>'
   +'<button class="ghost sm" id="out">خروج</button>'
   +'</header>'
   +'<div class="tabs">'
     +'<div class="tab'+(S.tab==='apts'?' on':'')+'" data-tab="apts">مواعيدي</div>'
     +'<div class="tab'+(S.tab==='book'?' on':'')+'" data-tab="book">حجز موعد</div>'
     +'<div class="tab'+(S.tab==='rec'?' on':'')+'" data-tab="rec">سجلي الطبي</div>'
     +'<div class="tab'+(S.tab==='cl'?' on':'')+'" data-tab="cl">العيادات</div>'
   +'</div>';

  if(S.tab==='apts'){
    h+= open.length
      ? '<div style="color:var(--muted);font-size:12px;margin-bottom:9px">المواعيد القادمة</div>'
        + open.map(aptCard).join('')
      : '<div class="empty"><div>📅</div>لا مواعيد قادمة</div>';
    if(past.length){
      h+='<div style="color:var(--muted);font-size:12px;margin:16px 0 9px">مواعيد سابقة</div>'
        + past.slice(0,10).map(aptCard).join('');
    }
  }

  if(S.tab==='book'){
    h+='<div class="card"><h2>طلب موعد جديد</h2>'
      +'<div class="hint">طلبك يصل للعيادة وتؤكده السكرتارية. ستُشعَر فور التأكيد.</div>'
      +(S.clinics.length>1?'<div class="field"><label>العيادة</label><select id="cl">'
        +S.clinics.map(function(c){return '<option value="'+c.id+'"'+(c.id===S.clinic?' selected':'')+'>'+esc(c.name_ar)+'</option>';}).join('')
        +'</select></div>':'')
      +'<div class="field"><label>التاريخ</label><input type="date" id="bd" value="'+esc(IAPP.todayLocal())+'"></div>'
      +'<div class="field"><label>الوقت المتاح</label><div id="slots" class="slots">'
      +'<div style="color:var(--muted);font-size:12px">اختر التاريخ</div></div></div>'
      +'<div class="field"><label>سبب الزيارة (اختياري)</label><input id="bt" placeholder="كشف / متابعة"></div>'
      +'<div class="err" id="be"></div>'
      +'<button class="full" id="bs">إرسال الطلب</button></div>';
  }

  if(S.tab==='rec'){
    h+='<div class="card"><h2>الوصفات</h2>'
      +(S.rx.length? S.rx.map(function(r){
          return '<div style="border-bottom:1px solid var(--border);padding:9px 0">'
            +'<div style="font-size:12px;color:var(--muted)">'+esc(r.prescribed_on||'')+'</div>'
            +(r.is_glasses?'<div style="font-size:13px">👓 وصفة نظارة</div>':'')
            +(r.legacy_medicines_text?'<div style="font-size:12.5px;white-space:pre-wrap">'+esc(r.legacy_medicines_text)+'</div>':'')
            +(r.notes?'<div class="meta">'+esc(r.notes)+'</div>':'')+'</div>';
        }).join('') : '<div class="empty" style="padding:18px"><div>💊</div>لا وصفات</div>')
      +'</div>'
      +'<div class="card"><h2>الفحوصات</h2>'
      +(S.exams.length? S.exams.map(function(e){
          return '<div style="border-bottom:1px solid var(--border);padding:9px 0">'
            +'<div style="font-size:12px;color:var(--muted)">'+esc(e.exam_date||'')+'</div>'
            +(e.treatment_plan?'<div style="font-size:13px">خطة العلاج: '+esc(e.treatment_plan)+'</div>':'')
            +((e.va_right||e.va_left)?'<div class="meta" dir="ltr" style="text-align:right">VA: '
              +esc(e.va_right||'-')+' / '+esc(e.va_left||'-')+'</div>':'')+'</div>';
        }).join('') : '<div class="empty" style="padding:18px"><div>🔬</div>لا فحوصات</div>')
      +'</div>';
  }

  if(S.tab==='cl'){
    h+= S.clinics.map(function(c){
      var wa=(c.whatsapp||'').replace(/[^\d]/g,'');
      return '<div class="card"><h2>'+esc(c.name_ar)+'</h2>'
        +(c.address?'<div class="kv"><span>العنوان</span><div>'+esc(c.address)+'</div></div>':'')
        +(c.phone?'<div class="kv"><span>الهاتف</span><div dir="ltr">'+esc(c.phone)+'</div></div>':'')
        +'<div class="row" style="margin-top:11px">'
        +(wa?'<button class="ghost sm" data-wa="'+wa+'">💬 واتساب</button>':'')
        +(c.phone?'<button class="ghost sm" data-tel="'+esc(c.phone)+'">📞 اتصال</button>':'')
        +'</div></div>';
    }).join('');
  }

  h+='</div>';
  root.innerHTML=h;
  wire();
  if(S.tab==='apts') paintActions();
  if(S.tab==='book') loadSlots();
}

function paintActions(){
  S.apts.forEach(function(a){
    var box=document.querySelector('[data-acts="'+a.id+'"]');
    if(!box) return;
    A.actionsFor(a,'patient').then(function(acts){
      if(!acts.length){
        var e=A.transitionsError&&A.transitionsError();
        if(e){
          box.innerHTML='<span style="color:var(--danger);font-size:10px">تعذّر تحميل الإجراءات: '+esc(e)+'</span>';
        } else { box.remove(); }
        return;
      }
      acts.forEach(function(ac){
        var b=document.createElement('button');
        b.className='sm '+(ac.to==='CANCELLED'?'danger':'ghost');
        b.textContent=ac.label;
        b.onclick=async function(){
          if(ac.requiresReason){
            var r=prompt('سبب الإلغاء:','');
            if(r===null) return;
            if(r.trim().length<3){ toast('اكتب سببًا واضحًا','bad'); return; }
            try{ await ac.run(r.trim()); toast('تم الإلغاء','good'); load(); }
            catch(e){ toast(e.message,'bad'); }
          } else {
            try{ await ac.run(); toast('تم','good'); load(); }
            catch(e){ toast(e.message,'bad'); }
          }
        };
        box.appendChild(b);
      });
    });
  });
}

var pickedSlot=null;
async function loadSlots(){
  pickedSlot=null;
  var box=document.getElementById('slots'); if(!box) return;
  var d=document.getElementById('bd'); if(!d) return;
  box.innerHTML='<div style="color:var(--muted);font-size:12px">جاري التحميل...</div>';
  try{
    var s=await A.availableSlots(S.clinic,d.value,null);
    if(!s||!s.length){ box.innerHTML='<div style="color:var(--gold);font-size:12px">العيادة لا تعمل في هذا اليوم</div>'; return; }
    var free=s.filter(function(x){return x.is_free;});
    if(!free.length){ box.innerHTML='<div style="color:var(--gold);font-size:12px">كل المواعيد محجوزة — جرّب يومًا آخر</div>'; return; }
    box.innerHTML=s.map(function(x){
      return '<div class="slot'+(x.is_free?'':' off')+'" data-s="'+x.slot_time+'">'+x.slot_time.slice(0,5)+'</div>';
    }).join('');
    box.querySelectorAll('[data-s]').forEach(function(el){
      if(el.classList.contains('off')) return;
      el.onclick=function(){
        box.querySelectorAll('.slot').forEach(function(o){o.classList.remove('on');});
        el.classList.add('on'); pickedSlot=el.getAttribute('data-s');
      };
    });
  }catch(e){ box.innerHTML='<div style="color:var(--danger);font-size:12px">'+esc(e.message)+'</div>'; }
}

function wire(){
  var out=document.getElementById('out');
  if(out) out.onclick=async function(){
    if(S.unsub) try{S.unsub();}catch(e){}
    await IAPP.signOut(); S.profile=null; S.link=null; renderAuth();
  };
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.onclick=function(){ S.tab=el.getAttribute('data-tab'); render(); };
  });
  var cl=document.getElementById('cl');
  if(cl) cl.onchange=function(){ S.clinic=cl.value; loadSlots(); };
  var bd=document.getElementById('bd');
  if(bd) bd.onchange=loadSlots;

  var bs=document.getElementById('bs');
  if(bs) bs.onclick=async function(){
    var e=document.getElementById('be');
    if(!pickedSlot){ e.textContent='اختر وقتًا'; return; }
    e.textContent=''; bs.disabled=true;
    try{
      // لا نرسل معرف المريض ولا حالة الموعد: الخادم يفرضهما من هوية الحساب
      await A.book({ clinicId:S.clinic, date:document.getElementById('bd').value,
                     time:pickedSlot, type:document.getElementById('bt').value||null });
      toast('وصل طلبك للعيادة','good');
      S.tab='apts'; await load();
    }catch(err){ e.textContent=err.message; bs.disabled=false; }
  };

  document.querySelectorAll('[data-wa]').forEach(function(el){
    el.onclick=function(){ window.open('https://wa.me/'+el.getAttribute('data-wa'),'_blank'); };
  });
  document.querySelectorAll('[data-tel]').forEach(function(el){
    el.onclick=function(){ window.location.href='tel:'+el.getAttribute('data-tel'); };
  });
}

})();
