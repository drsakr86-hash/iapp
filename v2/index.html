<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0F1E">
<title>I App — الطبيب</title>
<style>
  :root{
    --bg:#0A0F1E; --surface:#111827; --card:#141E30; --border:#1E2D45;
    --accent:#00C2FF; --teal:#00E5CC; --gold:#FFB830;
    --text:#E8F4FF; --muted:#6B8CAE; --danger:#FF4D6D; --success:#00E5B0;
    --purple:#A78BFA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.6;
       padding-bottom:env(safe-area-inset-bottom)}
  .app{max-width:780px;margin:0 auto;padding:12px}

  header{display:flex;align-items:center;gap:10px;padding:10px 4px 14px}
  .logo{font-size:22px}
  .title{font-weight:800;font-size:16px}
  .who{color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--success);box-shadow:0 0 8px var(--success)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
        padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 11px;color:var(--accent)}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);
        border-radius:10px;padding:10px 12px;color:var(--text);font-size:13.5px;
        outline:none;box-sizing:border-box;font-family:inherit;direction:rtl}
  textarea{min-height:62px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px 2px}
  .field{margin-bottom:10px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  button{border:none;border-radius:10px;padding:11px 16px;font-weight:700;font-size:13px;
         cursor:pointer;font-family:inherit;color:var(--bg);
         background:linear-gradient(135deg,var(--accent),var(--teal))}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  button.danger{background:linear-gradient(135deg,var(--danger),#B01030);color:#fff}
  button.sm{padding:7px 12px;font-size:11px;border-radius:8px}
  button:disabled{opacity:.45}
  .full{width:100%}

  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .tab{white-space:nowrap;background:var(--card);border:1px solid var(--border);
       color:var(--muted);border-radius:10px;padding:9px 14px;font-size:12.5px;
       font-weight:700;cursor:pointer}
  .tab.on{background:linear-gradient(135deg,var(--accent),var(--teal));
          color:var(--bg);border-color:transparent}
  .tab .n{display:inline-block;background:var(--danger);color:#fff;border-radius:9px;
          padding:0 6px;font-size:10px;margin-right:5px;font-weight:800}

  .apt{background:var(--card);border:1px solid var(--border);border-radius:14px;
       padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
  .apt::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--muted)}
  .apt.s-CONFIRMED::before{background:var(--accent)}
  .apt.s-ARRIVED::before,.apt.s-WAITING::before{background:var(--teal)}
  .apt.s-IN_CLINIC::before{background:var(--success)}
  .apt.s-COMPLETED::before{background:var(--muted)}
  .apt.s-CANCELLED::before,.apt.s-NO_SHOW::before{background:var(--danger)}
  .apt-top{display:flex;gap:11px}
  .time{text-align:center;min-width:58px}
  .time b{display:block;color:var(--accent);font-size:15px;font-weight:800;direction:ltr}
  .time span{display:block;color:var(--muted);font-size:9.5px;direction:ltr}
  .info{flex:1;min-width:0}
  .nm{font-weight:700;font-size:14px;cursor:pointer}
  .nm:active{color:var(--accent)}
  .chip{display:inline-block;border-radius:7px;padding:2px 8px;font-size:10px;font-weight:800}
  .meta{color:var(--muted);font-size:11px;margin-top:2px}
  .wait{color:var(--gold);font-size:11px;font-weight:700;margin-top:3px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;
        border-top:1px solid var(--border);padding-top:10px}

  .prow{display:flex;align-items:center;gap:10px;padding:11px 12px;
        background:var(--card);border:1px solid var(--border);border-radius:12px;
        margin-bottom:8px;cursor:pointer}
  .avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;
          background:linear-gradient(135deg,var(--accent),var(--teal));
          display:flex;align-items:center;justify-content:center;
          color:var(--bg);font-weight:800;font-size:14px}

  .empty{text-align:center;color:var(--muted);padding:34px 14px;font-size:13px}
  .empty div:first-child{font-size:34px;margin-bottom:8px;opacity:.5}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;
      align-items:flex-end;justify-content:center;z-index:60}
  .sheet{background:var(--surface);border:1px solid var(--border);
         border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:780px;
         max-height:94vh;overflow:auto}
  .sheet h3{margin:0 0 14px;font-size:15px;color:var(--accent)}
  @media(min-width:600px){ .ov{align-items:center;padding:16px} .sheet{border-radius:16px} }

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
         background:var(--surface);border:1px solid var(--accent);color:var(--text);
         border-radius:12px;padding:11px 18px;font-size:12.5px;z-index:90;
         max-width:90vw;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .toast.bad{border-color:var(--danger);color:var(--danger)}
  .toast.good{border-color:var(--success);color:var(--success)}

  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;
         justify-content:center;padding:26px}
  .login .box{width:100%;max-width:330px}
  .err{color:var(--danger);font-size:12px;text-align:center;margin-top:9px;min-height:16px}

  .kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
      border-bottom:1px solid var(--border);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv b{color:var(--muted);font-size:11.5px;font-weight:600;flex-shrink:0}
  .alert{background:rgba(255,77,109,.13);border:1px solid var(--danger);
         color:var(--danger);border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:10px}
  .warnbox{background:rgba(255,184,48,.12);border:1px solid var(--gold);
           color:var(--gold);border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:10px}
  .sec{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
  .sec h4{margin:0 0 9px;font-size:12.5px;color:var(--teal)}
  .item{border-bottom:1px solid var(--border);padding:9px 0;font-size:12.5px}
  .item:last-child{border-bottom:none}
  .dt{color:var(--muted);font-size:11px}
</style>
</head>
<body>
<div id="root"><div class="empty" style="padding-top:100px"><div>👁</div>جاري التحميل...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="./iapp-core.js?v=3"></script>
<script src="./appointment-service.js?v=3"></script>
<script>
(function(){
"use strict";
var APP_VERSION='D6';   // يظهر في الترويسة — لتمييز النسخة المحمّلة من المخزّنة
var A, root=document.getElementById('root');
var S={ profile:null, tab:'today', date:null, clinic:null, clinics:[], doctors:[],
        rows:[], patients:[], search:'', unsub:null, live:false, liveStatus:null };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m,k){ var d=document.createElement('div');
  d.className='toast'+(k?' '+k:''); d.textContent=m; document.body.appendChild(d);
  setTimeout(function(){d.remove();},3400); }
function sb(){ return IAPP.client(); }
function shiftDate(iso,n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDay(iso){ if(!iso) return '';
  var days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  return days[new Date(iso+'T00:00:00').getDay()]+' '+iso; }
function initials(n){ return (String(n||'?').trim()[0]||'?'); }

// ════════════════════════════════════════════════════════
function renderLogin(err,busy){
  root.innerHTML='<div class="login"><div class="box">'
   +'<div style="text-align:center;margin-bottom:26px">'
   +'<div style="font-size:44px">👁</div>'
   +'<div style="color:var(--accent);font-weight:800;font-size:20px">I App</div>'
   +'<div style="color:var(--muted);font-size:12px">تطبيق الطبيب · '
   +'<b style="color:var(--gold)">'+APP_VERSION+'</b></div></div>'
   +'<div class="field"><input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني" autocomplete="username"></div>'
   +'<div class="field"><input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password"></div>'
   +'<button class="full" id="go"'+(busy?' disabled':'')+'>'+(busy?'...':'دخول')+'</button>'
   +'<div class="err">'+esc(err||'')+'</div></div></div>';
  var go=function(){
    var em=document.getElementById('em').value, pw=document.getElementById('pw').value;
    if(!em||!pw){ renderLogin('أدخل البريد وكلمة المرور'); return; }
    renderLogin('',true);
    IAPP.signIn(em,pw).then(function(r){
      if(!r.ok){ renderLogin(r.error); return; }
      if(['doctor','admin'].indexOf(r.profile.role)===-1){
        IAPP.signOut();
        renderLogin('هذا الحساب ('+(IAPP.ROLE_AR[r.profile.role]||r.profile.role)+') غير مصرّح له');
        return;
      }
      S.profile=r.profile; boot();
    });
  };
  document.getElementById('go').onclick=go;
  document.getElementById('pw').onkeydown=function(e){ if(e.key==='Enter') go(); };
}

// ════════════════════════════════════════════════════════
async function boot(){
  S.date=S.date||IAPP.todayLocal();
  var c=await sb().from('clinics').select('id,code,name_ar').eq('is_active',true).order('name_ar');
  S.clinics=c.error?[]:(c.data||[]);
  if(!S.clinic&&S.clinics.length) S.clinic=S.clinics[0].id;
  var d=await sb().from('doctors').select('id,full_name_ar,short_name').order('full_name_ar');
  S.doctors=d.error?[]:(d.data||[]);
  subscribe(); await load();
}
function subscribe(){
  if(S.unsub) try{S.unsub();}catch(e){}
  S.unsub=A.subscribe({ clinicId:S.clinic, key:'doc',
    onChange:function(){ load(); },
    onReady:function(s){ S.live=(s==='SUBSCRIBED'); S.liveStatus=s; render(); } });
}
async function load(){
  try{ S.rows=await A.board({ clinicId:S.clinic, date:S.date })||[]; }
  catch(e){ toast(e.message,'bad'); }
  render();
}
async function loadPatients(q){
  var sel=sb().from('patients').select('id,patient_code,full_name,phone,gender,age_at_registration');
  if(q&&q.length>=2) sel=sel.or('full_name.ilike.%'+q+'%,phone.ilike.%'+q+'%,patient_code.ilike.%'+q+'%');
  var r=await sel.order('created_at',{ascending:false}).limit(40);
  S.patients=r.error?[]:(r.data||[]);
  render();
}

// ════════════════════════════════════════════════════════
function aptCard(a){
  var lab=A.statusLabel(a.status), wait=A.waitLabel(a);
  return '<div class="apt s-'+a.status+'">'
   +'<div class="apt-top">'
     +'<div class="time"><b>'+esc((a.scheduled_time||'').slice(0,5))+'</b>'
     +'<span>'+esc(a.scheduled_date||'')+'</span></div>'
     +'<div class="info">'
       +'<div class="nm" data-pat="'+esc(a.patient_id||'')+'">'+esc(a.display_name||'—')
       +(a.patient_id?' ›':' <span style="color:var(--gold);font-size:10px">(زائر)</span>')+'</div>'
       +'<div class="meta"><span class="chip" style="background:'+lab.color+'22;color:'+lab.color+'">'
       +lab.icon+' '+lab.ar+'</span>'
       +(a.appointment_type?' · '+esc(a.appointment_type):'')
       +(a.room?' · غرفة '+esc(a.room):'')+'</div>'
       +(wait&&['ARRIVED','WAITING'].indexOf(a.status)>-1
          ?'<div class="wait">⏱ ينتظر منذ '+esc(wait)+'</div>':'')
     +'</div></div>'
   +'<div class="acts" data-acts="'+a.id+'"></div></div>';
}

function render(){
  if(!S.profile) return;
  var live=S.rows.filter(function(a){ return A.isLive(a.status); });
  var h='<div class="app"><header>'
   +'<span class="logo">👁</span>'
   +'<div><div class="title">'+esc(S.profile.fullName||'الطبيب')+'</div>'
   +'<div class="who">'+esc(S.profile.email)+' · <b style="color:var(--gold)">'
   +esc(APP_VERSION)+'</b> · '+esc(A.build||'?')+'</div></div>'
   +'<div class="spacer"></div>'
   +'<div class="live"><span class="dot'+(S.live?' on':'')+'"></span>'
   +(S.live?'مباشر':(S.liveStatus&&S.liveStatus!=='SUBSCRIBED'?'غير متصل':'...'))+'</div>'
   +'<button class="ghost sm" id="out">خروج</button></header>'
   +'<div class="tabs">'
     +'<div class="tab'+(S.tab==='today'?' on':'')+'" data-tab="today">عيادة اليوم</div>'
     +'<div class="tab'+(S.tab==='wait'?' on':'')+'" data-tab="wait">غرفة الانتظار'
       +(live.length?'<span class="n">'+live.length+'</span>':'')+'</div>'
     +'<div class="tab'+(S.tab==='pat'?' on':'')+'" data-tab="pat">المرضى</div>'
   +'</div>';

  if(S.clinics.length>1){
    h+='<div class="field"><select id="cl">'+S.clinics.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===S.clinic?' selected':'')+'>'+esc(c.name_ar)+'</option>';
    }).join('')+'</select></div>';
  }

  if(S.tab==='today'){
    h+='<div style="display:flex;gap:8px;margin-bottom:10px">'
      +'<button class="ghost" data-shift="-1">‹</button>'
      +'<input type="date" id="dt" value="'+esc(S.date)+'" style="text-align:center;direction:ltr">'
      +'<button class="ghost" data-shift="1">›</button></div>'
      +'<div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px">'
      +esc(fmtDay(S.date))+' — '+S.rows.length+' موعد</div>';
    h+= S.rows.length ? S.rows.map(aptCard).join('')
      : '<div class="empty"><div>📅</div>لا مواعيد في هذا اليوم</div>';
  }

  if(S.tab==='wait'){
    h+='<div style="color:var(--muted);font-size:12px;margin-bottom:10px">'
      +'المرضى في العيادة الآن — اضغط الاسم لفتح الملف</div>';
    h+= live.length ? live.map(aptCard).join('')
      : '<div class="empty"><div>🪑</div>غرفة الانتظار فارغة</div>';
  }

  if(S.tab==='pat'){
    h+='<div class="field"><input id="pq" placeholder="🔍 بحث بالاسم أو الهاتف أو الكود" value="'+esc(S.search)+'"></div>'
      +'<button class="full" id="newPat" style="margin-bottom:12px">+ مريض جديد</button>';
    h+= S.patients.length ? S.patients.map(function(p){
      return '<div class="prow" data-pat="'+p.id+'">'
        +'<div class="avatar">'+esc(initials(p.full_name))+'</div>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-weight:700;font-size:13.5px">'+esc(p.full_name)+'</div>'
        +'<div class="meta">'+esc(p.patient_code||'')
        +(p.phone?' · '+esc(p.phone):'')
        +(p.age_at_registration?' · '+p.age_at_registration+' سنة':'')+'</div></div>'
        +'<div style="color:var(--muted)">›</div></div>';
    }).join('') : '<div class="empty"><div>👥</div>لا نتائج</div>';
  }

  h+='</div>'; root.innerHTML=h; wire();
  if(S.tab!=='pat') paintActions();
}

function paintActions(){
  S.rows.forEach(function(a){
    var box=document.querySelector('[data-acts="'+a.id+'"]');
    if(!box) return;
    A.actionsFor(a,S.profile.role).then(function(acts){
      if(!acts.length){
        A.diagnoseActions(a,S.profile.role).then(function(d){
          if(d.loaded===0||d.error){
            var w=document.createElement('div');
            w.style.cssText='color:var(--gold);font-size:10px;width:100%';
            w.textContent='تشخيص · '+d.build+' · حُمّل '+d.loaded+(d.error?' · '+d.error:'');
            box.appendChild(w);
          } else { box.remove(); }
        });
        return;
      }
      acts.forEach(function(ac){
        var b=document.createElement('button');
        b.className='sm'+(ac.to==='CANCELLED'||ac.to==='NO_SHOW'?' danger'
                        :(ac.to==='IN_CLINIC'||ac.to==='COMPLETED'?'':' ghost'));
        b.textContent=ac.label;
        b.onclick=function(){ runAction(a,ac); };
        box.appendChild(b);
      });
      if(a.patient_id){
        var v=document.createElement('button');
        v.className='sm ghost'; v.textContent='📋 الملف';
        v.onclick=function(){ openFile(a.patient_id); };
        box.appendChild(v);
      }
    });
  });
}

async function runAction(a,ac){
  if(ac.requiresReason){
    var r=prompt('السبب (إلزامي):',''); if(r===null) return;
    if(r.trim().length<3){ toast('اكتب سببًا واضحًا','bad'); return; }
    try{ await ac.run(r.trim()); toast('تم','good'); load(); }catch(e){ toast(e.message,'bad'); }
    return;
  }
  try{
    await ac.run(); toast('تم: '+ac.label,'good');
    // بعد الاستدعاء نفتح الملف مباشرة لتسجيل الكشف
    if(ac.to==='IN_CLINIC'&&a.patient_id) openFile(a.patient_id,a.id);
    load();
  }catch(e){ toast(e.message,'bad'); }
}

function wire(){
  var o=document.getElementById('out');
  if(o) o.onclick=async function(){
    if(S.unsub) try{S.unsub();}catch(e){}
    await IAPP.signOut(); S.profile=null; renderLogin();
  };
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.onclick=function(){ S.tab=el.getAttribute('data-tab');
      if(S.tab==='pat') loadPatients(S.search); else render(); };
  });
  document.querySelectorAll('[data-shift]').forEach(function(el){
    el.onclick=function(){ S.date=shiftDate(S.date,+el.getAttribute('data-shift')); load(); };
  });
  var dt=document.getElementById('dt');
  if(dt) dt.onchange=function(){ S.date=dt.value||IAPP.todayLocal(); load(); };
  var cl=document.getElementById('cl');
  if(cl) cl.onchange=function(){ S.clinic=cl.value; subscribe(); load(); };
  var pq=document.getElementById('pq');
  if(pq){ var t=null; pq.oninput=function(){ S.search=pq.value; clearTimeout(t);
    t=setTimeout(function(){ loadPatients(S.search); },320); }; }
  var np=document.getElementById('newPat');
  if(np) np.onclick=openNewPatient;
  document.querySelectorAll('[data-pat]').forEach(function(el){
    var id=el.getAttribute('data-pat'); if(!id) return;
    el.onclick=function(){ openFile(id); };
  });
}

// ════════════════════════════════════════════════════════
function sheet(html){
  var ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="sheet">'+html+'</div>';
  ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
  document.body.appendChild(ov); return ov;
}

function openNewPatient(){
  var ov=sheet('<h3>مريض جديد</h3>'
    +'<div class="field"><label>الاسم الكامل *</label><input id="n"></div>'
    +'<div class="row"><div class="field"><label>الهاتف</label><input id="ph" dir="ltr" type="tel"></div>'
    +'<div class="field"><label>العمر</label><input id="ag" type="number" dir="ltr"></div></div>'
    +'<div class="row"><div class="field"><label>النوع</label><select id="g">'
    +'<option value="male">ذكر</option><option value="female">أنثى</option>'
    +'<option value="unknown">غير محدد</option></select></div>'
    +'<div class="field"><label>فصيلة الدم</label><select id="bt"><option value="">—</option>'
    +['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(function(b){return '<option>'+b+'</option>';}).join('')
    +'</select></div></div>'
    +'<div class="field"><label>العنوان</label><input id="ad"></div>'
    +'<div class="field"><label>الحساسيات</label><input id="al" placeholder="بنسلين / لا يوجد"></div>'
    +'<div class="field"><label>التاريخ المرضي</label><textarea id="hx"></textarea></div>'
    +'<div class="err" id="e"></div>'
    +'<div class="row"><button class="ghost" id="c">إلغاء</button><button id="s">حفظ</button></div>');
  var $=function(i){return ov.querySelector('#'+i);};
  $('c').onclick=function(){ ov.remove(); };
  $('s').onclick=async function(){
    var n=$('n').value.trim();
    if(n.length<2){ $('e').textContent='أدخل اسم المريض'; return; }
    $('s').disabled=true;
    try{
      // الكود يُولَّد تسلسلياً من آخر كود موجود
      var last=await sb().from('patients').select('patient_code')
        .order('patient_code',{ascending:false}).limit(1);
      var num=1;
      if(!last.error&&last.data&&last.data.length){
        var m=String(last.data[0].patient_code||'').match(/(\d+)$/);
        if(m) num=parseInt(m[1],10)+1;
      }
      var code='P-'+String(num).padStart(4,'0');
      var r=await sb().from('patients').insert({
        patient_code:code, full_name:n,
        phone:$('ph').value.trim()||null,
        age_at_registration:$('ag').value?parseInt($('ag').value,10):null,
        gender:$('g').value, blood_type:$('bt').value||null,
        address:$('ad').value.trim()||null,
        allergies:$('al').value.trim()||null,
        medical_history:$('hx').value.trim()||null,
        primary_clinic_id:S.clinic
      }).select('id,patient_code').single();
      if(r.error) throw new Error(r.error.message);
      ov.remove(); toast('تم إنشاء '+r.data.patient_code,'good');
      loadPatients(''); openFile(r.data.id);
    }catch(e){ $('e').textContent=e.message; $('s').disabled=false; }
  };
}

// ── ملف المريض ─────────────────────────────────────────
async function openFile(pid, aptId){
  var ov=sheet('<div class="empty"><div>⏳</div>جاري التحميل...</div>');
  var box=ov.querySelector('.sheet');
  try{
    // البيانات السريرية تُقرأ عبر العرض المخصص للطبيب
    var p=await sb().from('v_patient_clinical').select('*').eq('id',pid).maybeSingle();
    if(p.error) throw new Error(p.error.message);
    if(!p.data) throw new Error('المريض غير موجود');
    var d=p.data;
    var vs=await sb().from('visits').select('*').eq('patient_id',pid)
            .order('visit_date',{ascending:false}).limit(20);
    var ex=await sb().from('examinations').select('*').eq('patient_id',pid)
            .order('exam_date',{ascending:false}).limit(20);
    var dx=await sb().from('diagnoses').select('*').eq('patient_id',pid)
            .order('diagnosed_on',{ascending:false}).limit(20);
    var iop=await sb().from('iop_measurements').select('*').eq('patient_id',pid)
            .order('measured_at',{ascending:false}).limit(12);

    var rx=await sb().from('prescriptions').select('*').eq('patient_id',pid)
            .order('prescribed_on',{ascending:false}).limit(20);
    var rf=await sb().from('refractions').select('*').eq('patient_id',pid).limit(60);
    var pi=await sb().from('prescription_items').select('*').limit(200);
    var rxs=rx.error?[]:(rx.data||[]);
    var allRefs=rf.error?[]:(rf.data||[]);
    var allItems=pi.error?[]:(pi.data||[]);
    var visits=vs.error?[]:(vs.data||[]), exams=ex.error?[]:(ex.data||[]);
    var dxs=dx.error?[]:(dx.data||[]), iops=iop.error?[]:(iop.data||[]);

    var h='<h3>📋 '+esc(d.full_name)+' <span style="color:var(--muted);font-size:12px">'
      +esc(d.patient_code||'')+'</span></h3>';

    if(d.allergies&&d.allergies.trim()&&!/^لا/.test(d.allergies))
      h+='<div class="alert">⚠️ حساسية: '+esc(d.allergies)+'</div>';
    if(d.medical_history&&d.medical_history.trim()&&!/^لا/.test(d.medical_history))
      h+='<div class="warnbox">📌 تاريخ مرضي: '+esc(d.medical_history)+'</div>';

    h+='<div class="row" style="margin-bottom:9px">'
      +'<button id="nv">+ زيارة وفحص</button>'
      +'<button id="ng">👓 وصفة نظارة</button></div>'
      +'<div class="row" style="margin-bottom:9px">'
      +'<button id="nd">💊 وصفة دواء</button>'
      +'<button id="nr">🩻 طلب أشعة</button></div>'
      +'<div class="row" style="margin-bottom:12px">'
      +(aptId?'<button class="ghost" id="fin">إنهاء الكشف</button>':'<button class="ghost" id="cls">إغلاق</button>')
      +'</div>';

    h+='<div class="sec"><h4>البيانات</h4>'
      +'<div class="kv"><b>الهاتف</b><div dir="ltr">'+esc(d.phone||'—')+'</div></div>'
      +'<div class="kv"><b>العمر</b><div>'+esc(d.age_at_registration||'—')+'</div></div>'
      +'<div class="kv"><b>النوع</b><div>'+(d.gender==='male'?'ذكر':d.gender==='female'?'أنثى':'—')+'</div></div>'
      +'<div class="kv"><b>فصيلة الدم</b><div dir="ltr">'+esc(d.blood_type||'—')+'</div></div>'
      +'<div class="kv"><b>العنوان</b><div>'+esc(d.address||'—')+'</div></div></div>';

    if(dxs.length){
      h+='<div class="sec"><h4>التشخيصات</h4>'+dxs.map(function(x){
        return '<div class="item"><div>'+esc(x.diagnosis_text)+'</div>'
          +'<div class="dt">'+esc(x.diagnosed_on||'')+(x.eye?' · '+esc(x.eye):'')+'</div></div>';
      }).join('')+'</div>';
    }
    if(iops.length){
      h+='<div class="sec"><h4>ضغط العين</h4>'+iops.map(function(x){
        var hi=x.value_mmhg>=21;
        return '<div class="item" style="display:flex;justify-content:space-between">'
          +'<span>'+esc(x.eye==='OD'?'اليمنى':'اليسرى')+'</span>'
          +'<span style="color:'+(hi?'var(--danger)':'var(--success)')+';font-weight:700" dir="ltr">'
          +x.value_mmhg+' mmHg'+(hi?' ⚠':'')+'</span>'
          +'<span class="dt">'+esc(String(x.measured_at||'').slice(0,10))+'</span></div>';
      }).join('')+'</div>';
    }
    if(exams.length){
      h+='<div class="sec"><h4>الفحوصات</h4>'+exams.map(function(x){
        return '<div class="item"><div class="dt">'+esc(x.exam_date||'')+'</div>'
          +((x.va_right||x.va_left)?'<div dir="ltr" style="text-align:right">VA: '
            +esc(x.va_right||'-')+' / '+esc(x.va_left||'-')+'</div>':'')
          +(x.treatment_plan?'<div>خطة: '+esc(x.treatment_plan)+'</div>':'')
          +(x.notes?'<div class="dt">'+esc(x.notes)+'</div>':'')+'</div>';
      }).join('')+'</div>';
    }
    if(rxs.length){
      h+='<div class="sec"><h4>الوصفات</h4>'+rxs.map(function(x){
        var refs=(allRefs||[]).filter(function(r){return r.prescription_id===x.id;});
        var its=(allItems||[]).filter(function(i){return i.prescription_id===x.id;});
        var g='';
        if(refs.length){
          g='<div style="direction:ltr;text-align:left;font-size:11.5px;margin-top:4px">'
            +refs.map(function(r){
              return (r.eye==='OD'?'OD':'OS')+': '
                +(r.sphere!=null?fmtD(r.sphere):'—')
                +(r.cylinder!=null&&r.cylinder!=0?' / '+fmtD(r.cylinder)+' × '+(r.axis!=null?r.axis:'—'):'')
                +(r.add_power?'  ADD '+fmtD(r.add_power):'');
            }).join('<br>')
            +(refs[0].ipd_mm?'<br>IPD '+refs[0].ipd_mm+' mm':'')+'</div>';
        }
        var meds = its.length
          ? '<div style="margin-top:4px">'+its.map(function(i){
              return '• '+esc(i.free_text||medName(i.medication_id))
                +(i.dose?' — '+esc(i.dose):'')+(i.frequency?' — '+esc(i.frequency):'')
                +(i.duration?' — '+esc(i.duration):'');
            }).join('<br>')+'</div>'
          : '';
        return '<div class="item"><div class="dt">'+esc(x.prescribed_on||'')
          +(x.is_glasses?' · 👓 نظارة':' · 💊 دواء')+'</div>'
          +g+meds
          +(x.notes?'<div class="dt">'+esc(x.notes)+'</div>':'')
          +'<div style="margin-top:6px"><button class="sm ghost" data-print="'+x.id+'">🖨 طباعة</button></div>'
          +'</div>';
      }).join('')+'</div>';
    }
    if(visits.length){
      h+='<div class="sec"><h4>الزيارات</h4>'+visits.map(function(x){
        return '<div class="item"><div class="dt">'+esc(x.visit_date||'')+'</div>'
          +(x.chief_complaint?'<div>'+esc(x.chief_complaint)+'</div>':'')
          +(x.summary?'<div class="dt">'+esc(x.summary)+'</div>':'')+'</div>';
      }).join('')+'</div>';
    }
    if(!visits.length&&!exams.length&&!dxs.length)
      h+='<div class="empty" style="padding:20px"><div>🩺</div>لا سجل سريري بعد</div>';

    box.innerHTML=h;
    var $=function(i){return ov.querySelector('#'+i);};
    if($('cls')) $('cls').onclick=function(){ ov.remove(); };
    if($('fin')) $('fin').onclick=async function(){
      try{ await A.complete(aptId); ov.remove(); toast('تم إنهاء الكشف','good'); load(); }
      catch(e){ toast(e.message,'bad'); }
    };
    $('nv').onclick=function(){ ov.remove(); openVisit(pid,aptId,d.full_name); };
    $('ng').onclick=function(){ ov.remove(); openGlasses(pid,aptId,d); };
    $('nd').onclick=function(){ ov.remove(); openDrugs(pid,aptId,d); };
    $('nr').onclick=function(){ ov.remove(); openRadiology(pid,aptId,d); };
    ov.querySelectorAll('[data-print]').forEach(function(el){
      el.onclick=function(){
        var id=el.getAttribute('data-print');
        var x=rxs.filter(function(r){return r.id===id;})[0];
        printRx(x, allRefs.filter(function(r){return r.prescription_id===id;}),
                   allItems.filter(function(i){return i.prescription_id===id;}), d);
      };
    });
  }catch(e){
    box.innerHTML='<div class="empty"><div>⚠️</div>'+esc(e.message)+'</div>';
  }
}

// ── زيارة + فحص كامل في نموذج واحد ─────────────────────
function openVisit(pid, aptId, name){
  var ov=sheet('<h3>🩺 زيارة وفحص — '+esc(name||'')+'</h3>'
   +'<div class="row">'
     +'<div class="field"><label>التاريخ</label><input type="date" id="vd" value="'+esc(IAPP.todayLocal())+'"></div>'

     +'<div class="row"><div class="field"><label>اليمنى OD</label>'
     +selBox('varS',VA_OPTIONS,'اختر...')
     +'<input id="var" dir="ltr" placeholder="أو اكتب" style="margin-top:5px"></div>'
     +'<div class="field"><label>اليسرى OS</label>'
     +selBox('valS',VA_OPTIONS,'اختر...')

   +'<div class="sec"><h4>ضغط العين (mmHg)</h4>'
     +'<div class="row"><div class="field"><label>اليمنى OD</label>'
     +'<input id="ior" type="number" step="0.1" dir="ltr" placeholder="14"></div>'
     +'<div class="field"><label>اليسرى OS</label>'
     +'<input id="iol" type="number" step="0.1" dir="ltr" placeholder="15"></div></div>'
   +'</div>'

   +'<div class="sec"><h4>الفحص</h4>'
     +'<div class="field"><label>القطاع الأمامي</label>'
     +selBox('antp',ANT_OPTS,'اختر لإضافته...')
     +'<textarea id="ant" placeholder="القرنية، القزحية، العدسة..." style="margin-top:5px"></textarea></div>'

     +selBox('postp',POST_OPTS,'اختر لإضافته...')

   +'<div class="sec"><h4>التشخيص والخطة</h4>'
     +'<div class="field"><label>التشخيص</label>'
     +selBox('dxS',DX_OPTS,'اختر تشخيصاً...')

     +selBox('tpp',PLAN_OPTS,'اختر لإضافته...')

     +'<div class="row"><div class="field"><label>موعد المتابعة</label><input type="date" id="fu"></div>'
     +'<div class="field"><label>ملاحظات</label><input id="nt"></div></div>'
   +'</div>'
   +'<div class="err" id="e"></div>'
   +'<div class="row"><button class="ghost" id="c">إلغاء</button><button id="s">حفظ</button></div>');

  var $=function(i){return ov.querySelector('#'+i);};

  bindFill(ov,'ccS','cc'); bindFill(ov,'varS','var');
  bindFill(ov,'valS','val'); bindFill(ov,'dxS','dx');
  bindAppend(ov,'antp','ant'); bindAppend(ov,'postp','post'); bindAppend(ov,'tpp','tp');

  $('s').onclick=async function(){
    $('s').disabled=true; $('e').textContent='';
    var iorV=$('ior').value, iolV=$('iol').value;
    if(iorV&&(+iorV<0||+iorV>80)){ $('e').textContent='ضغط العين اليمنى خارج المدى (0-80)'; $('s').disabled=false; return; }
    if(iolV&&(+iolV<0||+iolV>80)){ $('e').textContent='ضغط العين اليسرى خارج المدى (0-80)'; $('s').disabled=false; return; }
    try{
      var date=$('vd').value||IAPP.todayLocal();
      var v=await sb().from('visits').insert({
        patient_id:pid, clinic_id:S.clinic, visit_date:date,
        visit_type:$('vt').value, chief_complaint:$('cc').value.trim()||null
      }).select('id').single();
      if(v.error) throw new Error(v.error.message);

      var e=await sb().from('examinations').insert({
        patient_id:pid, visit_id:v.data.id, exam_date:date,
        chief_complaint:$('cc').value.trim()||null,
        va_right:$('var').value.trim()||null, va_left:$('val').value.trim()||null,
        anterior_segment:$('ant').value.trim()||null,
        posterior_segment:$('post').value.trim()||null,
        color_vision:$('cv').value.trim()||null,
        cover_test:$('ct').value.trim()||null,
        contrast_sensitivity:$('cs').value.trim()||null,
        treatment_plan:$('tp').value.trim()||null,
        notes:$('nt').value.trim()||null
      }).select('id').single();
      if(e.error) throw new Error(e.error.message);

      // ضغط العين: صف لكل عين
      var iops=[];
      if(iorV) iops.push({patient_id:pid,examination_id:e.data.id,visit_id:v.data.id,
                          eye:'OD',value_mmhg:parseFloat(iorV)});
      if(iolV) iops.push({patient_id:pid,examination_id:e.data.id,visit_id:v.data.id,
                          eye:'OS',value_mmhg:parseFloat(iolV)});
      if(iops.length){
        var i=await sb().from('iop_measurements').insert(iops);
        if(i.error) throw new Error('ضغط العين: '+i.error.message);
      }

      if($('dx').value.trim()){
        var g=await sb().from('diagnoses').insert({
          patient_id:pid, visit_id:v.data.id, examination_id:e.data.id,
          diagnosis_text:$('dx').value.trim(), is_primary:true, diagnosed_on:date
        });
        if(g.error) throw new Error('التشخيص: '+g.error.message);
      }
      if($('fu').value){
        var f=await sb().from('follow_ups').insert({
          patient_id:pid, visit_id:v.data.id, examination_id:e.data.id,
          clinic_id:S.clinic, due_date:$('fu').value, reason:'متابعة'
        });
        if(f.error) throw new Error('المتابعة: '+f.error.message);
      }

      ov.remove(); toast('تم حفظ الزيارة والفحص','good');
      openFile(pid,aptId);
    }catch(err){ $('e').textContent=err.message; $('s').disabled=false; }
  };
}

/**
 * قائمة اختيار أصلية.
 * ⚠️ لا نستخدم <datalist>: كثير من متصفحات الأندرويد لا تُظهرها إطلاقاً،
 * وهذا التطبيق يُستخدم على الهاتف أساساً. <select> يعمل في كل مكان.
 */
function selBox(id, arr, ph){
  return '<select id="'+id+'"><option value="">'+esc(ph||'اختر...')+'</option>'
    + arr.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join('')
    + '</select>';
}

/** الاختيار يملأ حقل نص يبقى قابلاً للتعديل — لا نحصر الطبيب في الخيارات */
function bindFill(ov, selId, inputId){
  var sel=ov.querySelector('#'+selId), inp=ov.querySelector('#'+inputId);
  if(!sel||!inp) return;
  // بعض متصفحات الأندرويد تُطلق input لا change على select — نستمع للاثنين
  var h=function(){ if(sel.value){ inp.value=sel.value; sel.value=''; } };
  sel.onchange=h; sel.addEventListener('input',h);
}

/** الاختيار يضيف سطراً لمنطقة نص — لتراكم عدة ملاحظات */
function bindAppend(ov, selId, boxId){
  var sel=ov.querySelector('#'+selId), box=ov.querySelector('#'+boxId);
  if(!sel||!box) return;
  var h=function(){
    if(!sel.value) return;
    box.value = box.value ? box.value.replace(/\s*$/,'') + '\n' + sel.value : sel.value;
    sel.value='';
  };
  sel.onchange=h; sel.addEventListener('input',h);
}

var MEDS=[];            // كتالوج الأدوية، يُحمَّل عند الحاجة
function medName(id){
  var m=MEDS.filter(function(x){return x.id===id;})[0];
  return m?m.name:'—';
}
async function loadMeds(){
  if(MEDS.length) return MEDS;
  var r=await sb().from('medications').select('id,name,form,strength')
        .eq('is_active',true).order('name');
  MEDS=r.error?[]:(r.data||[]);
  return MEDS;
}

/** تنسيق قوة العدسة: يجب أن تحمل إشارتها دائماً (+1.00 / -2.50) */
function fmtD(v){
  if(v===null||v===undefined||v==='') return '—';
  var n=parseFloat(v); if(isNaN(n)) return '—';
  return (n>0?'+':'')+n.toFixed(2);
}

/** خطوات الربع ديوبتر: قيمة خارجها تعني غالباً خطأ إدخال */
function isQuarterStep(v){
  if(v===''||v===null||v===undefined) return true;
  var n=parseFloat(v); if(isNaN(n)) return false;
  return Math.abs(Math.round(n*4)-n*4) < 1e-9;
}

function openGlasses(pid, aptId, pat){
  function eyeRow(k,label){
    return '<div class="sec"><h4>'+label+'</h4><div class="row3">'
      +'<div class="field"><label>SPH</label><input id="'+k+'s" dir="ltr" type="number" step="0.25" placeholder="-2.00"></div>'
      +'<div class="field"><label>CYL ±</label><input id="'+k+'c" dir="ltr" type="number" step="0.25" placeholder="-0.50 أو +0.50"></div>'
      +'<div class="field"><label>AXIS</label><input id="'+k+'a" dir="ltr" type="number" min="0" max="180" placeholder="180"></div>'
      +'</div></div>';
  }
  var ov=sheet('<h3>👓 وصفة نظارة — '+esc(pat.full_name)+'</h3>'
    +'<div class="field"><label>التاريخ</label><input type="date" id="gd" value="'+esc(IAPP.todayLocal())+'"></div>'
    +eyeRow('r','العين اليمنى OD')
    +eyeRow('l','العين اليسرى OS')
    +'<div class="sec"><div class="row">'
      +'<div class="field"><label>ADD (القراءة)</label><input id="ga" dir="ltr" type="number" step="0.25" placeholder="+1.00"></div>'
      +'<div class="field"><label>IPD (مم)</label><input id="gi" dir="ltr" type="number" step="0.5" placeholder="62"></div>'
    +'</div>'
    +'<div class="field"><label>ملاحظات</label><input id="gn"></div></div>'
    +'<div class="err" id="e"></div>'
    +'<div class="row"><button class="ghost" id="c">إلغاء</button><button id="s">حفظ</button></div>');

  var $=function(i){return ov.querySelector('#'+i);};
  $('c').onclick=function(){ ov.remove(); openFile(pid,aptId); };

  $('s').onclick=async function(){
    var e=$('e'); e.textContent='';
    var vals={rs:$('rs').value,rc:$('rc').value,ra:$('ra').value,
              ls:$('ls').value,lc:$('lc').value,la:$('la').value,
              ad:$('ga').value,ipd:$('gi').value};

    if(!vals.rs&&!vals.rc&&!vals.ls&&!vals.lc&&!vals.ad){
      e.textContent='أدخل قياساً واحداً على الأقل'; return; }

    // التحقق قبل الإرسال: رسالة أوضح من رفض قاعدة البيانات
    var chk=[['rs','الكروي اليمنى',30],['ls','الكروي اليسرى',30],
             ['rc','الأسطواني اليمنى',15],['lc','الأسطواني اليسرى',15]];
    for(var i=0;i<chk.length;i++){
      var v=vals[chk[i][0]];
      if(v!==''&&Math.abs(parseFloat(v))>chk[i][2]){
        e.textContent=chk[i][1]+' خارج المدى (±'+chk[i][2]+')'; return; }
      if(!isQuarterStep(v)){ e.textContent=chk[i][1]+' يجب أن يكون بخطوات 0.25'; return; }
    }
    if(vals.ra!==''&&(+vals.ra<0||+vals.ra>180)){ e.textContent='محور العين اليمنى بين 0 و180'; return; }
    if(vals.la!==''&&(+vals.la<0||+vals.la>180)){ e.textContent='محور العين اليسرى بين 0 و180'; return; }
    // الأسطواني بلا محور مرفوض في قاعدة البيانات — نمنعه هنا برسالة مفهومة
    if(vals.rc!==''&&parseFloat(vals.rc)!==0&&vals.ra===''){
      e.textContent='أدخل محور العين اليمنى مع الأسطواني'; return; }
    if(vals.lc!==''&&parseFloat(vals.lc)!==0&&vals.la===''){
      e.textContent='أدخل محور العين اليسرى مع الأسطواني'; return; }
    if(vals.ipd!==''&&(+vals.ipd<40||+vals.ipd>85)){ e.textContent='المسافة بين الحدقتين بين 40 و85'; return; }
    // ADD مقيَّد بـ 0–6 في قاعدة البيانات؛ نتحقق هنا لرسالة أوضح
    if(vals.ad!==''&&(+vals.ad<0||+vals.ad>6)){ e.textContent='قوة القراءة ADD بين 0 و+6'; return; }
    if(!isQuarterStep(vals.ad)){ e.textContent='قوة القراءة ADD بخطوات 0.25'; return; }

    $('s').disabled=true;
    try{
      var date=$('gd').value||IAPP.todayLocal();
      var rx=await sb().from('prescriptions').insert({
        patient_id:pid, clinic_id:S.clinic, prescribed_on:date,
        eye:'OU', is_glasses:true, notes:$('gn').value.trim()||null
      }).select('id').single();
      if(rx.error) throw new Error(rx.error.message);

      var rows=[], num=function(v){ return v===''?null:parseFloat(v); };
      function push(eye,sp,cy,ax){
        if(sp===''&&cy===''&&vals.ad==='') return;
        rows.push({ patient_id:pid, prescription_id:rx.data.id, measured_on:date,
          refraction_type:'final', eye:eye,
          sphere:num(sp), cylinder:num(cy), axis:ax===''?null:parseInt(ax,10),
          add_power:num(vals.ad), ipd_mm:num(vals.ipd) });
      }
      push('OD',vals.rs,vals.rc,vals.ra);
      push('OS',vals.ls,vals.lc,vals.la);
      if(rows.length){
        var r=await sb().from('refractions').insert(rows);
        if(r.error) throw new Error(r.error.message);
      }
      ov.remove(); toast('تم حفظ وصفة النظارة','good');
      openFile(pid,aptId);
    }catch(err){ e.textContent=err.message; $('s').disabled=false; }
  };
}

function openDrugs(pid, aptId, pat){
  var lines=[];
  var ov=sheet('<h3>💊 وصفة دواء — '+esc(pat.full_name)+'</h3>'
    +'<div class="field"><label>التاريخ</label><input type="date" id="dd" value="'+esc(IAPP.todayLocal())+'"></div>'
    +'<div id="ls"></div>'

  function draw(){
    $('ls').innerHTML = lines.length ? lines.map(function(l,i){

        +' <span style="float:left;color:var(--danger);cursor:pointer" data-del="'+i+'">حذف</span></h4>'

        +'<select class="medsel" data-i="'+i+'"><option value="">اختر من قائمة الأدوية...</option>'
        + MEDS.map(function(m){ return '<option value="'+esc(m.name)+'">'+esc(m.name)+'</option>'; }).join('')
        +'</select>'
        +'<input class="med" data-i="'+i+'" placeholder="أو اكتب اسم الدواء" value="'+esc(l.name||'')+'" style="margin-top:5px"></div>'
        +'<div class="row3">'
        +'<div class="field">'
        +'<select class="dosesel" data-i="'+i+'"><option value="">الجرعة</option>'
        + DOSE_OPTS.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>'
        +'<input class="dose" data-i="'+i+'" placeholder="أو اكتب" value="'+esc(l.dose||'')+'" style="margin-top:4px"></div>'
        +'<div class="field">'
        +'<select class="freqsel" data-i="'+i+'"><option value="">التكرار</option>'
        + FREQ_OPTS.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>'
        +'<input class="freq" data-i="'+i+'" placeholder="أو اكتب" value="'+esc(l.freq||'')+'" style="margin-top:4px"></div>'
        +'<div class="field">'
        +'<select class="dursel" data-i="'+i+'"><option value="">المدة</option>'
        + DUR_OPTS.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>'
        +'<input class="dur" data-i="'+i+'" placeholder="أو اكتب" value="'+esc(l.dur||'')+'" style="margin-top:4px"></div>'
        +'</div>'
        +'<div class="field"><select class="eye" data-i="'+i+'">'
        +'<option value="">كلتا العينين</option><option value="OD">اليمنى</option>'
        +'<option value="OS">اليسرى</option></select></div></div>';
    }).join('') : '<div class="empty" style="padding:16px"><div>💊</div>أضف دواءً</div>';

    ov.querySelectorAll('[data-del]').forEach(function(el){
      el.onclick=function(){ lines.splice(+el.getAttribute('data-del'),1); draw(); };
    });
    // اختيار من أي قائمة يملأ حقلها النصي الذي يبقى قابلاً للتعديل
    [['medsel','med','name'],['dosesel','dose','dose'],
     ['freqsel','freq','freq'],['dursel','dur','dur']].forEach(function(pr){
      ov.querySelectorAll('.'+pr[0]).forEach(function(el){
        el.onchange=function(){
          if(!el.value) return;
          var i=+el.getAttribute('data-i');
          lines[i][pr[2]]=el.value;
          var inp=ov.querySelector('.'+pr[1]+'[data-i="'+i+'"]');
          if(inp) inp.value=el.value;
          el.value='';
        };
      });
    });
    ['med','dose','freq','dur','eye'].forEach(function(cls){
      ov.querySelectorAll('.'+cls).forEach(function(el){
        el.oninput=el.onchange=function(){
          var i=+el.getAttribute('data-i');
          lines[i][cls==='med'?'name':cls==='dose'?'dose':cls==='freq'?'freq':cls==='dur'?'dur':'eye']=el.value;
        };
      });
    });
  }

  $('add').onclick=function(){ lines.push({name:'',dose:'',freq:'',dur:'',eye:''}); draw(); };

  // الكتالوج يُحمَّل أولاً ثم تُرسم الأسطر، وإلا ظهرت قائمة الأدوية فارغة
  lines.push({name:'',dose:'',freq:'',dur:'',eye:''});
  draw();
  loadMeds().then(function(){ draw(); });

  $('s').onclick=async function(){
    var e=$('e'); e.textContent='';
    var valid=lines.filter(function(l){ return (l.name||'').trim().length>1; });
    if(!valid.length){ e.textContent='أدخل اسم دواء واحد على الأقل'; return; }
    $('s').disabled=true;
    try{
      var date=$('dd').value||IAPP.todayLocal();
      var rx=await sb().from('prescriptions').insert({
        patient_id:pid, clinic_id:S.clinic, prescribed_on:date,
        is_glasses:false, notes:$('dn').value.trim()||null

      var meds=await loadMeds();

        var hit=meds.filter(function(m){ return m.name===l.name.trim(); })[0];
        return {
          prescription_id:rx.data.id,
          medication_id:hit?hit.id:null,
          // بلا تطابق في الكتالوج نحفظ النص كما كتبه الطبيب، ولا نخمّن
          free_text:hit?null:l.name.trim(),
          dose:l.dose||null, frequency:l.freq||null, duration:l.dur||null,
          eye:l.eye||null, sort_order:i, is_parsed:!!hit
        };
      });
      var r=await sb().from('prescription_items').insert(items);
      if(r.error) throw new Error(r.error.message);

      ov.remove(); toast('تم حفظ الوصفة','good');
      openFile(pid,aptId);
    }catch(err){ e.textContent=err.message; $('s').disabled=false; }
  };
}

   +'.pt{display:flex;justify-content:space-between;font-size:12px;'
   +'background:#f4f8fa;padding:7px 10px;border-radius:6px;margin-bottom:12px}'

   +'.nt{font-size:12px;background:#fffbe8;border:1px solid #e8d48a;'

   +'.ft{margin-top:26px;display:flex;justify-content:space-between;'
   +'font-size:11px;color:#555;border-top:1px solid #ccc;padding-top:8px}'
   +'</style></head><body>'
   +'<div class="hd"><h1>'+esc(clinic.name_ar||'عيادة العيون')+'</h1>'
   +'<div class="d">'+esc(doc)+'</div>'
   +'<div class="c">'+esc(clinic.address||'')+(clinic.phone?' · '+esc(clinic.phone):'')+'</div></div>'
   +'<div class="pt"><span><b>المريض:</b> '+esc(pat.full_name)+'</span>'
   +'<span><b>الكود:</b> '+esc(pat.patient_code||'')+'</span>'

   +body
   +(rx.notes?'<div class="nt"><b>ملاحظات:</b> '+esc(rx.notes)+'</div>':'')
   +'<div class="ft"><span>'+esc(clinic.name_ar||'')+'</span><span>التوقيع: ..................</span></div>'
   +'</body></html>';

  // إطار مخفي: أوثق من نافذة منبثقة قد يحجبها المتصفح على الهاتف
  var f=document.createElement('iframe');
  f.style.cssText='position:fixed;width:0;height:0;border:0;left:-9999px';
  document.body.appendChild(f);
  f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
  setTimeout(function(){
    try{ f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){ toast('تعذّرت الطباعة','bad'); }
    setTimeout(function(){ f.remove(); }, 1200);
  }, 320);
}

(async function(){
  if(!window.IAPP||!window.IAPP.appointments){
    root.innerHTML='<div class="empty"><div>⚠️</div>لم تُحمَّل الملفات المساعدة.</div>'; return;
  }
  A=IAPP.appointments;
  var s=await IAPP.getSession();
  if(!s){ renderLogin(); return; }
  var p=await IAPP.getProfile();
  if(!p||['doctor','admin'].indexOf(p.role)===-1){
    await IAPP.signOut(); renderLogin(p?'هذا الحساب غير مصرّح له':''); return;
  }
  S.profile=p; boot();
})();
})();
